<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Motipop en direct</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/d/polices-117650e856.css">
<style>
/* Mode direct (25/11) : écran à filmer avec OBS (1920x1080). Le tchat Twitch propose des mots, l'animateur joue la meilleure idée. */
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Nunito,Inter,system-ui,sans-serif;color:#eef2f7;background:radial-gradient(1200px 700px at 15% 10%,rgba(0,173,181,.28),transparent 60%),radial-gradient(1000px 700px at 90% 95%,rgba(162,107,255,.3),transparent 60%),linear-gradient(160deg,#12152e,#1d1838 60%,#2a1d46);overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;display:grid;grid-template-columns:1fr 600px;gap:36px;padding:40px 48px}
.glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:28px;backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
h2{margin:0;font:900 44px/1.1 Nunito,sans-serif}h2 small{display:block;font-size:24px;font-weight:700;color:#ffd88a;margin-top:6px}
.left{display:grid;grid-template-columns:auto 1fr;gap:36px;min-height:0}
.mj{padding:28px 32px;display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:10px}.row{display:grid;gap:10px}
.cell{width:92px;height:92px;border-radius:18px;display:grid;place-items:center;font:900 52px Nunito,sans-serif;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.14)}
.cell.c2{background:#14b8a6;border-color:#14b8a6;color:#fff}.cell.c1{background:rgba(255,200,87,.2);border-color:#ffc857;color:#fff}.cell.c0{background:rgba(120,130,160,.35);border-color:transparent;color:#cfd6e6}
.cell.first{color:#ff7aa8}.cell.flip{animation:flip .45s ease both}@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.who{font:700 22px Nunito,system-ui,sans-serif;color:#9fe6ff;min-height:30px}
.props{padding:28px 30px;display:flex;flex-direction:column;gap:14px;min-height:0}
.props ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.props li{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);cursor:pointer;font:800 34px Nunito,system-ui,sans-serif;letter-spacing:.08em}
.props li .n{margin-left:auto;font:800 24px Nunito,system-ui,sans-serif;color:#ffd88a;letter-spacing:0}.props li .by{font:600 20px Nunito,system-ui,sans-serif;color:#b9c3da;letter-spacing:0}
.props li:hover{background:rgba(20,184,166,.25)}.props li.bad{opacity:.35;text-decoration:line-through}
.hint{font:600 22px Nunito,system-ui,sans-serif;color:#c9d1e6}
.manual{display:flex;gap:10px}.manual input{flex:1;height:58px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff;font:800 30px Nunito,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:0 16px}
.manual button,.btn{height:58px;border-radius:14px;border:0;padding:0 22px;font:800 22px Nunito,system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,#00ADB5,#A26BFF);cursor:pointer}
.right{display:flex;flex-direction:column;gap:24px;min-height:0}
.brand{padding:26px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.brand .logo svg{width:420px;height:auto}.brand .url{font:900 46px Nunito,system-ui,sans-serif;color:#fff}.brand .url b{color:#ff7aa8}
.qr{display:flex;align-items:center;gap:20px}.qr svg{width:170px;height:170px;border-radius:14px}.qr p{margin:0;text-align:left;font:700 24px/1.3 Nunito,system-ui,sans-serif}
.salon{font:800 26px Nunito,system-ui,sans-serif;color:#ffd88a}
.en{padding:26px 28px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(90deg,#e3c993,#f9eed3 50%,#e3c993);color:#3b2a14;border:0}
.en .t{font:800 22px Nunito,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#7a3b6b}.en .q{font:700 32px/1.3 Georgia,serif}.en .a{font:800 28px Nunito,system-ui,sans-serif;color:#1f6b45;min-height:36px}
.live{display:flex;align-items:center;gap:10px;font:800 22px Nunito,system-ui,sans-serif}.live i{width:14px;height:14px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 12px #ff4d6d;animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.3}}
.live.off i{background:#8a93a8;box-shadow:none;animation:none}
.ban{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;padding:40px 70px;border-radius:36px;background:linear-gradient(135deg,rgba(20,184,166,.95),rgba(162,107,255,.95));text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5);transition:all .35s cubic-bezier(.2,1.4,.4,1);z-index:9}
.ban.on{opacity:1;transform:translate(-50%,-50%) scale(1)}.ban b{display:block;font:900 84px Nunito,system-ui,sans-serif}.ban span{font:800 40px Nunito,system-ui,sans-serif}
.cfg{position:fixed;right:12px;bottom:12px;z-index:20;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(0,0,0,.6);font:600 14px Inter,sans-serif}
.cfg input{width:150px;padding:6px 8px;border-radius:8px;border:1px solid #555;background:#111;color:#fff}.cfg button{padding:6px 10px;border-radius:8px;border:0;background:#334;color:#fff;cursor:pointer}
body.clean .cfg{display:none}
</style></head><body>

<script>
(()=>{const $=s=>document.querySelector(s),LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase();
// mise à l'échelle : la scène fait 1920x1080, la fenêtre peut être plus petite
const fit=()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);$("#stage").style.transform="scale("+s+")"};addEventListener("resize",fit);fit();
// ---------- Mot du jour : une partie « invitée » propre au direct ----------
let G=LS.get("fl-live-g");if(!G||!/^[a-z0-9]{12,24}$/.test(G)){G="live"+Math.random().toString(36).slice(2,14).replace(/[^a-z0-9]/g,"0");LS.set("fl-live-g",G)}
const call=b=>fetch("/api/p/mj",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({guest:G},b))}).then(r=>r.json());
let S=null,busy=false;const P=new Map();   // propositions : mot -> {n, by (1er pseudo), users:Set}
function draw(anim){if(!S)return;const g=$("#grid"),L=S.len;g.innerHTML="";
  for(let r=0;r<6;r++){const t=S.tries[r],row=document.createElement("div");row.className="row";row.style.gridTemplateColumns="repeat("+L+",92px)";
    for(let i=0;i<L;i++){const c=document.createElement("div");c.className="cell";
      if(t){c.textContent=t.g[i];c.classList.add("c"+t.c[i]);if(anim&&r===S.tries.length-1){c.classList.add("flip");c.style.animationDelay=i*90+"ms"}}
      else if(r===S.tries.length&&!S.done&&i===0){c.textContent=S.first;c.classList.add("first")}
      row.appendChild(c)}g.appendChild(row)}
  $("#rule").textContent=S.done?(S.ok?"Trouvé ! Bravo à tous.":"Raté… le mot était "+(S.word||"?")+"."):"Un mot de "+L+" lettres qui commence par "+S.first+" · "+(6-S.tries.length)+" essai"+(6-S.tries.length>1?"s":"")+" restant"+(6-S.tries.length>1?"s":"");
  $("#mjSub").textContent=S.done?(S.ok?"trouvé par le tchat !":"pas cette fois"):"avec le tchat";props()}
function props(){const L=[...P.entries()].sort((a,b)=>b[1].n-a[1].n||a[1].t-b[1].t).slice(0,7);
  $("#props").innerHTML=L.map(([w,p])=>'<li data-w="'+w+'" class="'+(p.bad?"bad":"")+'">'+w+' <span class="by">'+esc(p.by)+'</span><span class="n">'+p.n+' vote'+(p.n>1?"s":"")+'</span></li>').join("")||'<li style="cursor:default;font-size:24px;letter-spacing:0;opacity:.7">En attente des premières idées…</li>'}
$("#props").onclick=e=>{const li=e.target.closest("li[data-w]");if(li)play(li.dataset.w)};
async function play(w){w=norm(w).replace(/[^A-Z]/g,"");if(!S||S.done||busy||w.length!==S.len||w[0]!==S.first)return;busy=true;
  try{const r=await call({op:"essai",g:w});if(r.refus){const p=P.get(w);if(p)p.bad=1;props();$("#who").textContent="« "+w+" » n'est pas dans le dictionnaire";return}
    S=Object.assign(S,r);const p=P.get(w);$("#who").textContent=p?"Idée de "+p.by+(p.n>1?" (et "+(p.n-1)+" autre"+(p.n>2?"s":"")+")":""):"";P.delete(w);draw(true);
    if(S.ok)setTimeout(()=>ban("Trouvé !",p?"Bravo "+p.by+" : "+w:w),700);else if(S.done)setTimeout(()=>ban("Raté…","Le mot était "+(S.word||"?")),700)}
  catch(e){$("#who").textContent="Connexion au site impossible, réessaie"}finally{busy=false}}

// ---------- énigme : celle d'hier, dont la solution est connue ----------
let EN=null;fetch("/api/p/en",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({guest:G})}).then(r=>r.json()).then(r=>{EN=r&&r.hier;$("#enQ").textContent=EN?EN.q:"Pas d'énigme ce soir"}).catch(()=>{});
const enOk=t=>{if(!EN||!EN.s)return false;const a=norm(EN.s).replace(/^(LE|LA|LES|L'|UN|UNE)\s*/,"").replace(/[^A-Z ]/g,"").trim();return a&&norm(t).replace(/[^A-Z ]/g," ").includes(a)};
let enDone=false;const enWin=by=>{if(enDone||!EN)return;enDone=true;$("#enA").textContent=(by?"Bravo "+by+" : ":"Réponse : ")+EN.s;$("#enGo").hidden=true;if(by)ban("Énigme trouvée !","Bravo "+by)};
$("#enGo").onclick=()=>enWin("");
// ---------- bannière ----------
function ban(t,s){$("#banT").textContent=t;$("#banS").textContent=s;$("#ban").classList.add("on");clearTimeout(ban.h);ban.h=setTimeout(()=>$("#ban").classList.remove("on"),5000)}
// ---------- tchat Twitch en lecture seule (connexion anonyme) ----------
function chat(user,text){const T=norm(text);

let ws=null;function connect(ch){ch=String(ch||"").trim().toLowerCase().replace(/^#/,"");if(!/^[a-z0-9_]{3,25}$/.test(ch))return;LS.set("fl-live-ch",ch);
  try{if(ws)ws.close()}catch(e){}ws=new WebSocket("wss://irc-ws.chat.twitch.tv:443");
  ws.onopen=()=>{ws.send("CAP REQ :twitch.tv/tags");ws.send("PASS SCHMOOPIIE");ws.send("NICK justinfan"+(10000+Math.floor(Math.random()*80000)));ws.send("JOIN #"+ch)};
  ws.onmessage=e=>String(e.data).split("\r\n").forEach(l=>{if(!l)return;if(l.startsWith("PING")){ws.send("PONG :tmi.twitch.tv");return}
    if(/ 366 /.test(l)){$("#live").classList.remove("off");$("#live span").textContent="Tchat Twitch connecté : "+ch}

  ws.onclose=()=>{$("#live").classList.add("off");$("#live span").textContent="Tchat déconnecté";setTimeout(()=>{if(LS.get("fl-live-ch")===ch&&(!ws||ws.readyState>1))connect(ch)},5000)}}

// ---------- réglages : chaîne et salon (aussi par l'adresse : /direct?twitch=nom&salon=CODE&propre=1) ----------
const q=new URLSearchParams(location.search),ch=q.get("twitch")||LS.get("fl-live-ch")||"",sal=(q.get("salon")||LS.get("fl-live-sal")||"").toUpperCase();
$("#ch").value=ch;$("#sal").value=sal;const showSal=v=>{$("#salon").textContent=v?"Salon du direct : "+v:""};showSal(sal);
$("#sal").oninput=()=>{const v=$("#sal").value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);$("#sal").value=v;LS.set("fl-live-sal",v);showSal(v)};
if(ch)connect(ch);if(q.get("propre"))document.body.classList.add("clean");
$("#clean").onclick=()=>document.body.classList.add("clean");addEventListener("keydown",e=>{if(e.key==="Escape")document.body.classList.toggle("clean")});
props()})();
</script></body></html>
