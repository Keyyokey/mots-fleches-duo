<title>Le mot du jour — Mots Fléchés Duo</title>
<meta name="description" content="Trouve le mot du jour en 6 essais, avec sa définition en indice.">
<meta name="theme-color" content="#121214">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#121214;--card:#1E1E24;--line:#2f2f39;--ink:#ECEDF2;--muted:#8B8C99;--accent:#00ADB5;--violet:#A26BFF;--ok:#2fbf71;--mid:#e0a526;--no:#3a3a44;--key:#2a2a33;color-scheme:dark}
body.light{--bg:#F2F4F7;--card:#fff;--line:#D6DCE4;--ink:#14181F;--muted:#5E6573;--accent:#00858C;--violet:#6D3FD8;--ok:#1f9d57;--mid:#c88a0a;--no:#8a909c;--key:#e3e7ee;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:480px;flex:1;display:flex;flex-direction:column;gap:10px;padding:12px max(12px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:1.35rem;font-weight:800}
h1 b{background:linear-gradient(90deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
a.back,button{font-family:inherit;font-weight:600;font-size:.95rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px;cursor:pointer;text-decoration:none}
.hint{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.95rem;display:flex;gap:10px;align-items:center;justify-content:space-between}
.hint span{color:var(--muted)}.hint b{color:var(--ink)}
.board{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;margin:4px auto;width:min(100%,330px);aspect-ratio:5/6}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.t{border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:clamp(1.4rem,8vw,2rem);font-weight:800;text-transform:uppercase;transition:transform .1s}
.t.f{border-color:var(--muted);animation:pop .12s}
.t.ok,.t.mid,.t.no{color:#fff;border-color:transparent;animation:flip .5s ease both;animation-delay:var(--d)}
.t.ok{background:var(--ok)}.t.mid{background:var(--mid)}.t.no{background:var(--no)}
.row.shake{animation:shake .4s}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.msg{min-height:1.4em;text-align:center;font-weight:700}
.kb{display:flex;flex-direction:column;gap:6px;margin-top:auto;user-select:none}
.kr{display:flex;gap:5px;justify-content:center}
.k{flex:1;min-width:0;height:52px;border-radius:9px;border:none;background:var(--key);color:var(--ink);font-size:1.1rem;font-weight:700;padding:0}
.k.w{flex:1.6;font-size:.85rem}
.k.ok{background:var(--ok);color:#fff}.k.mid{background:var(--mid);color:#fff}.k.no{background:var(--no);color:#fff;opacity:.7}
.end{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:8px}
.end .w{font-size:1.4rem;font-weight:800;letter-spacing:.15em;color:var(--accent)}
.stats{display:flex;gap:6px}.stats div{flex:1}.stats b{display:block;font-size:1.3rem}.stats span{font-size:.72rem;color:var(--muted)}
.primary{background:linear-gradient(135deg,var(--accent),#0a8f96);color:#041b1d;border-color:transparent}
[hidden]{display:none!important}
</style>
</head>

const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase();
const VALID=new Set(DATA.valid);
const today=(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")})();
const dayN=Math.floor((new Date(today+"T12:00:00")-new Date("2026-10-25T12:00:00"))/864e5);
const [ANS,CLUE]=DATA.ans[((dayN%DATA.ans.length)+DATA.ans.length)%DATA.ans.length];
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let st=LS.get("mot-"+today,{rows:[],done:false,clue:false});
let cur="";const $=id=>document.getElementById(id);
// salon d'origine : le bouton retour y ramène
try{const s=JSON.parse(localStorage.getItem("fl-salons")||"{}");const k=Object.keys(s).sort((a,b)=>s[b]-s[a])[0];if(k)$("back").href="/"+k}catch(e){}
const b=$("board");for(let r=0;r<6;r++){const row=document.createElement("div");row.className="row";for(let c=0;c<5;c++){const t=document.createElement("div");t.className="t";row.appendChild(t)}b.appendChild(row)}
const ROWS=["AZERTYUIOP","QSDFGHJKLM","↵WXCVBN⌫"];const keys={};
ROWS.forEach(r=>{const d=document.createElement("div");d.className="kr";[...r].forEach(ch=>{const k=document.createElement("button");k.type="button";k.className="k"+(ch==="↵"||ch==="⌫"?" w":"");k.textContent=ch==="↵"?"Entrée":ch==="⌫"?"⌫":ch;k.onclick=()=>press(ch);d.appendChild(k);keys[ch]=k});$("kb").appendChild(d)});
function score(g){const res=Array(5).fill("no");const a=[...ANS];[...g].forEach((ch,i)=>{if(ch===a[i]){res[i]="ok";a[i]=null}});[...g].forEach((ch,i)=>{if(res[i]!=="ok"){const j=a.indexOf(ch);if(j>=0){res[i]="mid";a[j]=null}}});return res}
const RANK={no:1,mid:2,ok:3};
function paint(anim){st.rows.forEach((g,r)=>{const res=score(g);const row=b.children[r];[...g].forEach((ch,i)=>{const t=row.children[i];t.textContent=ch;t.className="t "+res[i];t.style.setProperty("--d",anim&&r===st.rows.length-1?(i*0.18)+"s":"0s");const k=keys[ch];if(k){const prev=k.dataset.s;if(!prev||RANK[res[i]]>RANK[prev]){k.dataset.s=res[i];k.className="k "+res[i]}}})});
  if(!st.done){const row=b.children[st.rows.length];if(row)[...row.children].forEach((t,i)=>{t.textContent=cur[i]||"";t.className="t"+(cur[i]?" f":"")})}
  $("showClue").hidden=st.clue||st.done;if(st.clue||st.done)$("clue").textContent=CLUE;
  if(st.done)showEnd()}
function msg(t){$("msg").textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>$("msg").textContent="",2200)}
function press(ch){if(st.done)return;if(ch==="⌫"){cur=cur.slice(0,-1);paint();return}if(ch==="↵"){submit();return}if(cur.length<5&&/^[A-Z]$/.test(ch)){cur+=ch;paint()}}
function submit(){const row=b.children[st.rows.length];if(cur.length<5){shake(row);msg("Il faut 5 lettres");return}
  if(!VALID.has(cur)){shake(row);msg("Mot inconnu");return}
  st.rows.push(cur);const win=cur===ANS;cur="";if(win||st.rows.length>=6){st.done=true;st.win=win;record(win)}
  LS.set("mot-"+today,st);paint(true);if(st.rows.length===3&&!st.done&&!st.clue)msg("L'indice est disponible ↑")}
function shake(row){row.classList.remove("shake");void row.offsetWidth;row.classList.add("shake")}
function record(win){const s=LS.get("mot-stats",{played:0,won:0,streak:0,best:0,last:null});s.played++;if(win){const y=new Date(Date.now()-864e5);const yd=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");s.won++;s.streak=s.last===yd?s.streak+1:1;s.best=Math.max(s.best,s.streak);s.last=today}else s.streak=0;LS.set("mot-stats",s)}
function showEnd(){const s=LS.get("mot-stats",{played:0,won:0,streak:0,best:0});const e=$("end");e.hidden=false;
  e.innerHTML=(st.win?"<div>🎉 Bravo, trouvé en "+st.rows.length+" essai"+(st.rows.length>1?"s":"")+" !</div>":"<div>Raté pour aujourd'hui… le mot était :</div>")+'<div class="w">'+ANS+'</div><div class="stats"><div><b>'+s.played+'</b><span>parties</span></div><div><b>'+(s.played?Math.round(100*s.won/s.played):0)+'%</b><span>réussite</span></div><div><b>🔥 '+s.streak+'</b><span>série</span></div><div><b>'+s.best+'</b><span>record</span></div></div><div style="display:flex;gap:8px;justify-content:center"><button type="button" id="share">📤 Partager</button><a class="back primary" href="'+$("back").href+'">Jouer aux mots fléchés</a></div><div style="font-size:.8rem;color:var(--muted)">Nouveau mot demain à minuit.</div>';
  $("share").onclick=()=>{const em={ok:"🟩",mid:"🟨",no:"⬛"};const t="🎯 Le mot du jour "+today.split("-").reverse().slice(0,2).join("/")+" — "+(st.win?st.rows.length:"X")+"/6"+(st.clue?" (avec indice)":"")+"\n"+st.rows.map(g=>score(g).map(x=>em[x]).join("")).join("\n")+"\n"+location.origin+"/mot";
    if(navigator.share)navigator.share({text:t}).catch(()=>{});else window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank")}}
$("showClue").onclick=()=>{if(st.rows.length<3){msg("Encore "+(3-st.rows.length)+" essai"+(3-st.rows.length>1?"s":"")+" avant l'indice");return}st.clue=true;LS.set("mot-"+today,st);paint()};
document.addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==="Enter"){e.preventDefault();press("↵")}else if(e.key==="Backspace"){e.preventDefault();press("⌫")}else{const c=norm(e.key);if(/^[A-Z]$/.test(c)&&e.key.length===1)press(c)}});
let th=LS.get("fl-theme-raw",null);try{th=localStorage.getItem("fl-theme")}catch(e){}
function theme(m){document.body.classList.toggle("light",m==="light");$("theme").textContent=m==="light"?"🌙":"☀️";try{localStorage.setItem("fl-theme",m)}catch(e){}}
theme(th||"dark");$("theme").onclick=()=>theme(document.body.classList.contains("light")?"dark":"light");
