<!doctype html>
<html lang="fr">
<head>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="/d/rond-d3a2909c93.js" as="script">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mots Fléchés Duo — tables de jeu</title>
<meta name="description" content="Le Tourniquet et les mots mêlés, en solo ou en duel en direct.">
<meta name="theme-color" content="#121214">
<link media="print" onload="this.media='all'" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Condensed:wght@400;500&display=swap">
<style>
:root{
  --bg:#121214;--card:#1E1E24;--card2:#26262e;--line:#2f2f39;--ink:#ECEDF2;--muted:#8B8C99;
  --accent:#00ADB5;--accent-soft:rgba(0,173,181,.16);--violet:#A26BFF;--good:#3ddc97;--bad:#ff4d6d;--warn:#ffc857;
  --p0:#5ad8ff;--p1:#ffa45c;--p2:#7cf0a9;--p3:#c49bff;--reveal:#5b5d6b;--revealInk:#B9BECA;--filledInk:#F7F8FB;--fillMix:40%;--clue:#1a2a33;--clue-ink:#bfe9ec;
  --cellbg:#2a2a33;--glass:rgba(30,30,36,.96);--hair:rgba(255,255,255,.08);--shadow:rgba(0,0,0,.45);--scrim:rgba(5,5,8,.6);
  --r-lg:16px;--r-md:12px;color-scheme:dark
}
body.light{
  --bg:#F2F4F7;--card:#FFFFFF;--card2:#E9EDF2;--line:#D6DCE4;--ink:#14181F;--muted:#5E6573;
  --accent:#00858C;--accent-soft:rgba(0,133,140,.12);--violet:#6D3FD8;--good:#11905A;--bad:#D92D4A;--warn:#B97800;
  --p0:#0B6FB8;--p1:#D24A0B;--p2:#1E8A3E;--p3:#6B3FE0;--reveal:#AAB1BC;--revealInk:#6B7280;--filledInk:#0F131A;--fillMix:26%;--clue:#DDEFF1;--clue-ink:#0E3A3F;
  --cellbg:#FFFFFF;--glass:rgba(255,255,255,.97);--hair:rgba(15,25,40,.10);--shadow:rgba(20,30,50,.16);--scrim:rgba(20,25,35,.35);color-scheme:light
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
button{font-size:.98rem;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r-md);padding:10px 14px;cursor:pointer;min-height:44px;transition:transform .08s,background .15s,border-color .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:default;transform:none}
button.primary{background:linear-gradient(135deg,var(--accent),#0a8f96);color:#041b1d;border-color:transparent;font-weight:800}
body.light button.primary{color:#fff}
input[type=text],select{font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg);color:var(--ink);min-height:44px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-left,0px)) 28px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{background:linear-gradient(90deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.ico{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:1.05rem}
/* tables de jeu */
.tables{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tbl{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);text-decoration:none;color:var(--ink);min-height:62px;position:relative}
.tbl .t{font-weight:800;font-size:.98rem}.tbl .s{font-size:.76rem;color:var(--muted)}
.tbl.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 18px var(--accent-soft);background:linear-gradient(135deg,var(--accent-soft),transparent)}
.tbl .live{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
@media (max-width:560px){.tables{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* accueil */
.lobby{display:flex;flex-direction:column;gap:14px}
.lcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.invite{border-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),transparent)}
.inv-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lbl{font-size:.76rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.inv-code{font-size:1.9rem;font-weight:800;letter-spacing:.18em;color:var(--accent)}
.wa{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:var(--r-md);background:#25d366;color:#06301a;font-weight:700;text-decoration:none}
.count{font-size:.86rem;font-weight:600;color:var(--warn)}.count.ok{color:var(--good)}
.muted{color:var(--muted)}
.hero h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);line-height:1.45}
h2{margin:0;font-size:1.02rem;font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md)}
.seg button{min-height:44px;background:transparent;border-color:transparent;box-shadow:none}
.seg button[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.players{display:flex;flex-direction:column;gap:8px}
.players label{display:flex;align-items:center;gap:10px}
.players input{flex:1;min-width:0}
.sw{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.err{color:var(--bad);font-weight:600;min-height:1.2em}
.rules{font-size:.88rem;line-height:1.5;color:var(--muted)}.rules b{color:var(--ink)}
.rules p{margin:.3em 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.panel .seg,.panel select{background:var(--bg)}
.pickrow{display:flex;gap:8px}.pickrow select{flex:1;min-width:0}
@media (min-width:900px){
  .lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;align-items:start}
  .lcol-a{position:sticky;top:16px}
}
/* partie */
body.playing{overflow:hidden}
body.playing .wrap{max-width:1400px;height:100dvh;padding-bottom:10px}
body.playing header,body.playing .tables{display:none}
#game{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"left tools" "board board" "under under" "acts acts";gap:8px;min-height:0;flex:1}
.gleft{grid-area:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.gtools{grid-area:tools;position:relative;align-self:start;z-index:20}
.board{grid-area:board;overflow:auto;min-height:0;border-radius:var(--r-lg);overscroll-behavior:contain}
.under{grid-area:under;min-width:0}
.acts{grid-area:acts;display:grid;grid-template-columns:1fr 2fr;gap:8px}
.gname{display:none;font-size:1.2rem;font-weight:800}
.gname b{background:linear-gradient(90deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.scores{display:flex;flex-direction:column;gap:5px}
.chip{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:6px 8px 6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);position:relative;overflow:hidden}
.chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc)}
.chip .av{width:9px;height:9px;border-radius:50%;background:var(--line);font-size:0}
.chip.on{border-color:var(--pc);box-shadow:0 0 14px color-mix(in srgb,var(--pc) 35%,transparent)}
.chip.on .av{background:var(--pc);box-shadow:0 0 8px var(--pc)}
.chip .who{display:flex;flex-direction:column;min-width:0}
.chip .nm{font-weight:700;color:var(--pc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.chip .sub{display:none;font-size:.76rem;color:var(--muted)}
.chip b{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums}
.chip b.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.45);color:var(--good)}}
.chip .clk{font-size:.86rem;font-weight:800;font-variant-numeric:tabular-nums;border-radius:8px;padding:3px 8px;background:var(--card2);color:var(--muted);min-width:3.4em;text-align:center}
.chip .clk:empty{display:none}
.chip.on .clk{background:var(--pc);color:#041b1d}
.chip.on .clk.low{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.status{font-size:.88rem;color:var(--muted);min-height:1.3em}
.status.good{color:var(--good)}.status.bad{color:var(--bad)}.status.wait{color:var(--warn)}
.progress{height:4px;border-radius:999px;background:var(--card2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--violet));transition:width .5s}
.gsalon{display:none;font-size:.8rem;color:var(--muted)}
.menubtn{display:flex;align-items:center;gap:8px;font-weight:700}
.menubtn .chev{color:var(--accent)}
.dropdown{position:absolute;right:0;top:52px;min-width:250px;background:var(--glass);border:1px solid var(--hair);border-radius:var(--r-lg);padding:8px;display:flex;flex-direction:column;gap:5px;box-shadow:0 14px 40px var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.dropdown button{text-align:left;box-shadow:none}
.dropdown .info{font-size:.78rem;color:var(--muted);padding:2px 4px}
.k{min-height:52px;font-size:1.02rem;font-weight:800}
.k.go{background:linear-gradient(135deg,var(--accent),#0a8f96);color:#041b1d;border:none}
body.light .k.go{color:#fff}
.k .long{display:none}
.answer{display:flex;gap:8px;align-items:center;background:var(--glass);border:1px solid rgba(0,173,181,.45);border-radius:var(--r-md);padding:8px 10px}
.answer .clue{flex:1;min-width:0;font-weight:600;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.answer input{width:9.5em;text-transform:uppercase;letter-spacing:.2em;font-weight:800;text-align:center}
.win{border:1px solid var(--good);border-radius:var(--r-lg);padding:12px;text-align:center;font-weight:700;background:rgba(61,220,151,.08);display:flex;flex-direction:column;gap:8px;align-items:center}
.win .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.overlay{position:fixed;inset:0;z-index:40;background:var(--scrim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px}
.sheet{background:var(--glass);border:1px solid var(--hair);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:10px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px var(--shadow)}
.sheet h3{margin:0}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.opts button{flex:1 1 140px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;background:var(--glass);border:1px solid var(--hair);padding:10px 16px;border-radius:999px;font-weight:600;box-shadow:0 10px 30px var(--shadow);transition:opacity .5s;max-width:92vw;text-align:center}
.toast.out{opacity:0}
.flash{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:45;pointer-events:none;background:var(--glass);border:1px solid var(--accent);font-weight:800;font-size:1.3rem;padding:14px 24px;border-radius:var(--r-lg);box-shadow:0 0 40px rgba(0,173,181,.5);animation:fl 1.5s forwards}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1}100%{opacity:0}}
#confetti{position:fixed;inset:0;z-index:44;pointer-events:none}
.sharesheet{max-width:460px;max-height:92vh;overflow:auto}
.sharetxt{max-height:110px;overflow:auto;text-align:left;font-size:.78rem;line-height:1.25;white-space:pre-wrap;background:var(--bg);padding:8px 10px;border-radius:10px;margin:0;font-family:inherit}
.sharebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qreact{display:flex;gap:4px}.qreact button{flex:1;min-height:36px;padding:0;font-size:1.15rem;background:var(--card);box-shadow:none}
body.mode-solo .qreact,body.mode-solo .salonboard{display:none!important}
.react{position:fixed;z-index:46;pointer-events:none;font-size:2.4rem;animation:floatup 2.2s ease-out forwards}
@keyframes floatup{0%{transform:translateY(0) scale(.5);opacity:0}15%{transform:translateY(-10px) scale(1.2);opacity:1}100%{transform:translateY(-140px) scale(1);opacity:0}}
.salonboard{gap:8px}.sb-h{display:flex;justify-content:space-between;font-weight:800}.sb-n{font-weight:500;color:var(--muted);font-size:.84rem}
.sb-empty{color:var(--muted);font-size:.86rem}
.sb-t{display:grid;grid-template-columns:2em minmax(0,1fr) 2.6em 4em 4.2em;gap:6px 8px;align-items:center;font-size:.9rem}
.sb-t>span:nth-child(-n+5){font-size:.74rem;color:var(--muted);font-weight:700}
.sb-t>span{text-align:right}.sb-t>span:nth-child(2){text-align:left}.sb-t>span:nth-child(5n+1),.sb-t .sb-name{text-align:left}
.sb-name{display:flex;flex-direction:column;min-width:0}.sb-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sb-name small{color:var(--muted);font-size:.72rem}.sb-name.me b{color:var(--accent)}
/* ---------- Tourniquet ---------- */
.rholder{display:flex;flex-direction:column;align-items:center;gap:6px;--R:40px}
.rond{--nc:6;--B:calc(var(--R)*.62);--C:calc(var(--R)*1.3);position:relative;margin:0 auto;width:calc(var(--R)*1.732*var(--nc) + var(--B) + 6px);height:calc(var(--R)*6 + var(--B) + 6px);flex:none}
.rc{z-index:1;position:absolute;width:var(--C);height:var(--C);border-radius:50%;transform:translate(-50%,-50%);background:var(--clue);color:var(--clue-ink);display:grid;place-items:center;text-align:center;padding:6px;cursor:pointer;font-family:"Roboto Condensed","Arial Narrow",sans-serif;font-size:calc(var(--C)*.15);line-height:1.08;border:2px solid transparent;transition:border-color .15s,box-shadow .15s,background .15s;overflow:hidden;word-break:normal}
.rc span{display:block;max-width:100%}
.rc:active{transform:translate(-50%,-50%) scale(.96)}
.rc.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 0 18px rgba(0,173,181,.4);background:color-mix(in srgb,var(--accent) 22%,var(--clue))}
.rc.done{background:color-mix(in srgb,var(--fc) 18%,var(--card));color:var(--muted)}
.rc.done span{text-decoration:line-through;opacity:.8}
.rb{z-index:2;pointer-events:none;position:absolute;width:var(--B);height:var(--B);border-radius:50%;transform:translate(-50%,-50%);background:var(--cellbg);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:calc(var(--B)*.55);color:var(--ink);transition:background .15s,transform .15s}
.rholder .rond + .rond .rb[data-b^="rs-2-"],.rholder .rond:first-child:not(:only-child) .rb[data-b^="rs-2-"]{outline:2px dashed var(--accent);outline-offset:1px}
.rb.first::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top:6px solid var(--accent);border-bottom:0}
.rb.hint{color:var(--muted);background:var(--card2)}
.rb.pend{color:var(--ink);background:color-mix(in srgb,var(--accent) 30%,var(--cellbg))}
.rb.live{opacity:.7;box-shadow:inset 0 0 0 2px currentColor}
.rb.f{background:color-mix(in srgb,var(--fc) var(--fillMix),var(--cellbg));color:var(--filledInk);border-color:var(--fc);border-width:2px}
.rb.rev{color:var(--revealInk);background:repeating-linear-gradient(135deg,var(--cellbg) 0 5px,color-mix(in srgb,var(--revealInk) 14%,var(--cellbg)) 5px 8px)}
.rb.ok{animation:pop .5s both;animation-delay:var(--d,0s)}
.rb.wrong{background:var(--bad)!important;color:#fff!important;animation:shake .4s}
@keyframes pop{40%{transform:translate(-50%,-50%) scale(1.25)}}
@keyframes shake{20%,60%{margin-left:-4px}40%,80%{margin-left:4px}}
/* ---------- Mots mêlés ---------- */
.mm{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px}
.mgrid{--s:30px;display:grid;grid-template-columns:repeat(var(--n),var(--s));grid-auto-rows:var(--s);gap:2px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);touch-action:none;user-select:none;-webkit-user-select:none}
.ml{display:grid;place-items:center;border-radius:6px;background:var(--cellbg);font-weight:800;font-size:calc(var(--s)*.56);cursor:pointer;position:relative}
.ml.dragging{background:color-mix(in srgb,var(--accent) 45%,var(--cellbg));color:#fff}
.ml.f{background:color-mix(in srgb,var(--fc) var(--fillMix),var(--cellbg));color:var(--filledInk);box-shadow:inset 0 -3px 0 var(--fc)}
.ml.f2{box-shadow:inset 0 0 0 2px var(--fc2)}
.ml.rev{background:color-mix(in srgb,var(--revealInk) 22%,var(--cellbg));color:var(--revealInk)}
.ml.wrong{background:var(--bad);color:#fff}
.ml.ok{animation:mpop .45s both;animation-delay:var(--d,0s)}
@keyframes mpop{40%{transform:scale(1.25)}}
.rc.rico{animation:rico .9s ease 2}@keyframes rico{50%{box-shadow:0 0 0 6px var(--good,#3ddc97);transform:translate(-50%,-50%) scale(1.12)}}
.invbanner{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;max-width:min(560px,94vw);background:var(--glass,var(--card));border:1px solid var(--good,#3ddc97);border-radius:16px;padding:10px 12px;box-shadow:0 14px 40px rgba(0,0,0,.35);transition:opacity .5s}
.invbanner .ib-t{font-weight:700;flex:1 1 200px}.invbanner button{min-height:40px}.invbanner.out{opacity:0}
.mcount{width:100%;text-align:center;font-weight:800;margin-bottom:2px}.mcount b{color:var(--good,#3ddc97)}
.mwords{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:720px}
.mw{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:.86rem;letter-spacing:.04em}
.mw.f{border-color:var(--fc);color:var(--fc);text-decoration:line-through;background:color-mix(in srgb,var(--fc) 12%,var(--card))}
.mw.rev{color:var(--revealInk);text-decoration:line-through}
@media (min-width:900px){
  body.playing .wrap{padding-top:16px}
  #game{grid-template-columns:270px minmax(0,1fr) 270px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"left under tools" "left board acts" "left board acts";gap:12px 24px}
  .gname{display:block}.gsalon{display:block;margin-top:auto}
  .gleft{gap:12px}
  .chip{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"av who sc" "ck ck ck";padding:12px 14px;border-radius:var(--r-lg);row-gap:10px;column-gap:12px}
  .chip .av{grid-area:av;width:42px;height:42px;font-size:1.05rem;font-weight:800;display:grid;place-items:center;color:#041b1d;background:var(--pc)}
  .chip:not(.on) .av{opacity:.75}
  .chip .who{grid-area:who}.chip .sub{display:block}
  .chip b{grid-area:sc;font-size:1.6rem}
  .chip .clk{grid-area:ck;font-size:1.7rem;padding:6px 0;border-radius:10px}
  .menubtn{width:100%;justify-content:space-between;height:52px}
  .dropdown{left:0;right:0;top:60px;min-width:0}
  .acts{display:flex;flex-direction:column-reverse;justify-content:flex-start;align-self:end}
  .acts .k.go{min-height:64px;font-size:1.2rem}
  .k .long{display:inline}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tinfo{display:flex;align-items:center;gap:8px;justify-content:center;font-size:.8rem;color:var(--muted);margin:4px 0}
.tinfo b{color:var(--ink)}

body.sk-fleches #gridbox{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:12px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
body.sk-fleches .c{border-radius:0!important;background:rgba(10,20,40,.62)!important;color:#f2f5fb}
body.sk-fleches .c .L{color:#f2f5fb}
body.sk-fleches .grid>:first-child{border-top-left-radius:12px!important}
body.sk-fleches .q{border-radius:0!important;background:linear-gradient(160deg,#0f4c5c,#0b3a47)!important}
body.sk-fleches .q>div{color:#e8fbff!important;font-family:Inter,system-ui,sans-serif!important;font-weight:700!important;text-transform:uppercase;letter-spacing:.01em}
body.sk-fleches .q>div+div{border-top:1px solid rgba(255,255,255,.35)!important}
body.sk-fleches .q>div.hl{background:linear-gradient(135deg,#00ADB5,#A26BFF)!important;color:#fff!important}
body.sk-fleches .ar{color:#ffc857!important;text-shadow:0 0 3px rgba(0,0,0,.6);z-index:4}
body.sk-fleches .c .n{right:2px!important;top:auto!important;bottom:2px;width:1.35em;height:1.35em;border-radius:50%;display:grid;place-items:center;background:#ffc857;color:#1b1300!important;font-weight:800!important}
body.sk-fleches .c.f{background:color-mix(in srgb,var(--fc) 32%,rgba(10,20,40,.62))!important;box-shadow:none!important}
body.sk-fleches .c.f .L{color:#fff!important}
body.sk-fleches .c.pp .L{color:#9aa3b5!important}
body.sk-fleches .c.word{background:color-mix(in srgb,#34d399 14%,rgba(10,20,40,.62))!important;box-shadow:inset 0 0 0 2px #34d399!important}
body.sk-fleches .c.sel{background:color-mix(in srgb,#34d399 30%,rgba(10,20,40,.62))!important;box-shadow:inset 0 0 0 2px #34d399,0 0 14px rgba(52,211,153,.5)!important;transform:none!important}
body.sk-fleches .c.sel .L{color:#fff!important}
body.sk-fleches #g .lastp{box-shadow:inset 0 0 0 2px var(--fc),0 0 12px var(--fc)!important}
body.sk-fleches .c.db{box-shadow:inset 0 -3px 0 #ffc857!important}body.sk-fleches .c.dr{box-shadow:inset -3px 0 0 #ffc857!important}
/* mode clair */
body.sk-fleches.light .grid{background:#b9c4d2!important;border-color:#b9c4d2!important}
body.sk-fleches.light #gridbox{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.9)}
body.sk-fleches.light .c{background:#d5deea!important}
body.sk-fleches.light .c .L{color:#0f131a}
body.sk-fleches.light .q{background:#0b5a6b!important}
body.sk-fleches.light .q>div{color:#fff!important}
body.sk-fleches.light .c.f{background:color-mix(in srgb,var(--fc) 24%,#fff)!important}
body.sk-fleches.light .c.f .L{color:#0f131a!important}
body.sk-fleches.light .c.word{background:color-mix(in srgb,#059669 12%,#fff)!important;box-shadow:inset 0 0 0 2px #059669!important}
body.sk-fleches.light .c.sel{background:color-mix(in srgb,#059669 25%,#fff)!important;box-shadow:inset 0 0 0 2px #059669!important}
body.sk-fleches.light .c.sel .L{color:#0f131a!important}
body.sk-fleches.light .c.pp .L{color:#8a93a3!important}
</style></head>
<body>
<div class="wrap">
  <header>
    <a class="brand" id="home" href="/"><b>MOTS FLÉCHÉS</b> duo</a>
    <button class="ico" id="soundBtn" type="button" aria-label="Son">🔊</button>
    <button class="ico" id="themeBtn" type="button" aria-label="Thème">☀️</button>
  </header>
  <nav class="tables" id="tables" aria-label="Tables de jeu"></nav>

  <section class="lobby" id="lobby">
    <div class="lcol lcol-a">
      <div class="card hero"><h1 id="heroTitle"></h1><p id="heroText"></p></div>
      <div class="card invite multiOnly">
        <div class="inv-top"><div><div class="lbl">Ton salon</div><div class="inv-code" id="code"></div></div>
          <div style="display:flex;gap:8px"><a class="wa" id="wa" target="_blank" rel="noopener">WhatsApp</a><button type="button" id="copy">Copier le lien</button></div></div>
        <div class="count" id="count">Connexion…</div>
      </div>
      <div class="card invite" id="liveCard" hidden><div style="font-weight:800" id="liveT"></div><div class="muted" style="font-size:.86rem" id="liveS"></div><button type="button" class="primary" id="liveBtn">▶ Rejoindre la partie</button></div>
      <div class="card salonboard multiOnly" id="salonBoard"></div>
      <div class="card" id="dailyCard" hidden><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div style="font-weight:800" id="dailyT"></div><div class="muted" style="font-size:.85rem" id="dailyS"></div></div><button type="button" class="primary" id="dailyBtn">Jouer</button></div></div>
    </div>
    <div class="lcol lcol-b panel">
      <h2>1. Mode de jeu</h2>
      <div class="seg" id="modeSeg" role="radiogroup"><button type="button" data-v="solo" role="radio">👤 Solo</button><button type="button" data-v="multi" role="radio">👥 À plusieurs</button></div>
      <h2>2. Difficulté</h2>
      <div class="seg" id="lvlSeg" role="radiogroup"><button type="button" data-v="facile" role="radio">🌱 Facile</button><button type="button" data-v="moyen" role="radio">⚖️ Normal</button><button type="button" data-v="difficile" role="radio">🔥 Difficile</button></div>
      <div id="ruleRow" class="multiOnly"><h2 style="margin-bottom:8px">Règle du duel</h2><div class="seg" id="ruleSeg" role="radiogroup"><button type="button" data-v="tour" role="radio">🔁 Chacun son tour</button><button type="button" data-v="course" role="radio">⏱ Contre la montre</button></div></div>
      <h2 id="pickT">3. Grille</h2>
      <div class="pickrow"><select id="pick" aria-label="Choix de la grille"></select></div>
      <div class="muted" id="pickInfo" style="font-size:.86rem"></div>
      <h2 id="playersT" class="multiOnly">4. Joueurs</h2>
      <div id="resume" hidden><button class="primary" id="resumeBtn" type="button" style="width:100%">Reprendre la partie en cours</button><div class="muted" id="resumeInfo" style="text-align:center;font-size:.85rem;margin-top:4px"></div></div>
      <div class="players multiOnly" id="players"></div>
      <button type="button" id="addP" class="multiOnly" style="border-style:dashed;background:transparent;color:var(--muted)">＋ Ajouter un joueur</button>
      <label style="display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600" id="timerRow">⏱ <span id="timerLbl">Chrono</span> <select id="tsel"></select></label>
      <div class="err" id="lerr"></div>
      <button class="primary" id="start" type="button" style="min-height:54px;font-size:1.1rem">▶ Lancer la partie</button>
      <button type="button" id="tutoBtn" style="background:transparent">❓ Comment jouer (30 secondes)</button>
      <details class="rules"><summary style="cursor:pointer;font-weight:700;color:var(--ink)">📖 Règles</summary><div id="rulesTxt"></div></details>
    </div>
  </section>

  <section id="game" hidden>
    <aside class="gleft">
      <div class="gname" id="gname"></div>
      <div class="scores" id="scores"></div><div class="tinfo" id="tinfo" hidden></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="progress"><i id="prog"></i></div>
      <div class="qreact" id="qreact" aria-label="Réactions"></div>
      <div class="gsalon" id="gsalon"></div>
    </aside>
    <div class="gtools">
      <button class="menubtn" id="menuBtn" type="button" aria-expanded="false"><span>Menu</span><span class="chev" id="chev">▾</span></button>
      <div class="dropdown" id="menu" hidden>
        <button type="button" id="mPass">⏭ Passer mon tour</button>
        <button type="button" id="mReveal">💡 Révéler ce mot</button>
        <button type="button" id="mAll">🏳️ Tout afficher (fin)</button>
        <button type="button" id="mTheme">☀️ Mode clair</button>
        <button type="button" id="mSound">🔊 Son activé</button>
        <button type="button" id="mSeat">👤 Changer de joueur</button>
        <div class="info" id="mInfo"></div>
      </div>
    </div>
    <div class="under" id="under"></div>
    <div class="board" id="board"></div>
    <div class="acts" id="acts">
      <button class="k" id="back" type="button">← Retour<span class="long"> aux tables</span></button>
      <button class="k go" id="valid" type="button">✓ Valider</button>
    </div>
  </section>
</div>
<div class="overlay" id="seatBox" hidden><div class="sheet"><h3>Qui joue sur cet appareil ?</h3><div class="opts" id="seatOpts"></div><div class="muted" style="font-size:.85rem">Chacun chez soi : choisis ton pseudo. Tous sur le même appareil : « Tout le monde ».</div></div></div>
<div class="overlay" id="whoBox" hidden><div class="sheet"><h3>Qui a trouvé ce mot ?</h3><div class="opts" id="whoOpts"></div><button type="button" id="whoCancel">Annuler</button></div></div>
<canvas id="confetti" hidden></canvas>
<script>// ---------- pseudo : accueil, « Ma page », salons rattachés ----------
(function(){
  const RE=/^[A-Z0-9@#_]{2,7}$/;
  const L={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
  const pm=location.pathname.match(/^\/([A-Za-z0-9]{5})(\/|$)/);const LINK=pm?pm[1].toUpperCase():null;
  let ME=null;try{ME=JSON.parse(L.get("fl-me")||"null")}catch(e){}
  if(ME&&!RE.test(ME.name||""))ME=null;
  const GUEST=()=>!ME&&L.get("fl-guest")==="1";
  window.__meName=ME?ME.name:null;
  // salon déjà rattaché au pseudo : pas besoin de reconfirmer le code
  if(ME&&LINK&&(ME.salons||[]).some(s=>s.code===LINK))L.set("fl-ok-"+LINK,"1");
  if(ME){try{const n=JSON.parse(L.get("fl-names")||"[]");if(n[0]!==ME.name){n[0]=ME.name;L.set("fl-names",JSON.stringify(n))}}catch(e){}}
  function clean(v){return String(v||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9@#_]/g,"").slice(0,7)}
  async function call(route,body){try{const r=await fetch("/api/p/"+route,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch(e){}return{status:r.status,...j}}catch(e){return{status:0,msg:"Pas de connexion au serveur. Réessaie dans un instant."}}}
  function store(){if(ME)L.set("fl-me",JSON.stringify(ME));else L.del("fl-me");window.__meName=ME?ME.name:null}
  function localSalons(){try{const o=JSON.parse(L.get("fl-salons")||"{}");return Object.keys(o).filter(k=>/^[A-Z0-9]{5}$/.test(k))}catch(e){return[]}}
  async function link(code,remove){if(!ME||!/^[A-Z0-9]{5}$/.test(code||""))return;const r=await call("link",{name:ME.name,token:ME.token,salon:code,remove:!!remove});
    if(r.status===200){ME.salons=r.salons;store()}else if(r.status===401){ME.stale=true;store()}return r}
  window.__linkSalon=c=>{if(ME&&c&&!(ME.salons||[]).some(s=>s.code===c&&Date.now()-s.t<6e5))link(c)};
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function ago(t){const m=Math.round((Date.now()-t)/6e4);if(m<2)return"à l'instant";if(m<60)return"il y a "+m+" min";const h=Math.round(m/60);if(h<24)return"il y a "+h+" h";const d=Math.round(h/24);return"il y a "+d+" jour"+(d>1?"s":"")}
  function newCode(){const CH="ABCDEFGHJKMNPQRSTUVWXYZ23456789";return Array.from({length:5},()=>CH[Math.floor(Math.random()*CH.length)]).join("")}
  function close(){const o=document.getElementById("pgBox");if(o)o.remove();document.body.classList.remove("pg-open")}
  function shell(html,dismiss){close();const ov=document.createElement("div");ov.id="pgBox";ov.className="overlay pgbox";ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");
    ov.innerHTML='<div class="sheet pgsheet"><div class="pg-brand"><span class="pg-m" aria-hidden="true">M</span><span><b>MOTS FLÉCHÉS</b> duo</span></div>'+html+'</div>';
    document.body.appendChild(ov);document.body.classList.add("pg-open");if(dismiss)ov.addEventListener("click",e=>{if(e.target===ov)close()});return ov}

  // ---------- écran pseudo (créer ou se reconnecter) ----------
  function gate(opts){opts=opts||{};
    const ov=shell('<h2>'+(opts.title||"Ton pseudo")+'</h2>'
      +(opts.why?'<p class="muted pg-why">'+esc(opts.why)+'</p>':'')
      +'<form class="pg-form" autocomplete="off"><label for="pgName">Pseudo</label><input id="pgName" class="pg-name" maxlength="7" autocapitalize="characters" spellcheck="false" placeholder="EX : JULIE_7" inputmode="text">'
      +'<div class="pg-rule muted">2 à 7 caractères : lettres, chiffres, @ # _</div>'
      +'<div class="pg-state" aria-live="polite"></div>'
      +'<div class="pg-pinrow" hidden><label for="pgPin" class="pg-pinlbl">Code secret (4 chiffres)</label><input id="pgPin" class="pg-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••"></div>'
      +'<div class="pg-warn" hidden>⚠️ Ce pseudo sera <b>ta marque dans le jeu</b> : il s\'affiche dans les parties et rattache tes salons, sur tous tes appareils. Il ne pourra pas être changé.</div>'
      +'<div class="pg-err" role="alert"></div>'
      +'<button type="submit" class="primary pg-go" disabled>Continuer</button></form>'
      +(opts.noGuest?'':'<button type="button" class="pg-guest">Jouer sans pseudo <span class="muted">(solo uniquement, pas de salons)</span></button>')
      +(opts.cancel?'<button type="button" class="pg-cancel">Annuler</button>':''),!!opts.cancel);
    const $=s=>ov.querySelector(s),nm=$("#pgName"),pin=$("#pgPin"),st=$(".pg-state"),go=$(".pg-go"),err=$(".pg-err");let exists=null,seq=0,tmr=null;
    const upd=()=>{const v=nm.value;const ok=RE.test(v);$(".pg-pinrow").hidden=!ok||exists===null;$(".pg-warn").hidden=!(ok&&exists===false);
      go.disabled=!(ok&&exists!==null&&/^\d{4}$/.test(pin.value));go.textContent=exists?"Me reconnecter":exists===false?"Créer mon pseudo":"Continuer"};
    nm.addEventListener("input",()=>{const c=clean(nm.value);if(c!==nm.value)nm.value=c;exists=null;err.textContent="";st.textContent="";st.className="pg-state";upd();clearTimeout(tmr);
      if(!RE.test(c)){if(c.length===1)st.textContent="Encore un caractère au moins.";return}
      const my=++seq;st.textContent="Vérification…";tmr=setTimeout(async()=>{const r=await call("check",{name:c});if(my!==seq)return;
        if(r.status!==200){st.textContent=r.msg||"Serveur injoignable.";st.className="pg-state bad";return}
        exists=!!r.exists;st.className="pg-state "+(exists?"old":"ok");
        st.textContent=exists?"Ce pseudo existe déjà. C'est toi ? Entre ton code secret.":"✓ Ce pseudo est libre. Choisis un code secret à 4 chiffres : il ne sera demandé que sur un nouvel appareil.";
        $(".pg-pinlbl").textContent=exists?"Ton code secret":"Choisis ton code secret (4 chiffres)";upd()},350)});
    pin.addEventListener("input",()=>{pin.value=pin.value.replace(/\D/g,"").slice(0,4);err.textContent="";upd()});
    $(".pg-form").onsubmit=async e=>{e.preventDefault();if(go.disabled)return;go.disabled=true;const name=nm.value;
      const r=await call(exists?"login":"create",{name,pin:pin.value});
      if(r.status!==200){err.textContent=r.msg||"Erreur ("+r.status+")";if(r.status===401){pin.value="";pin.focus()}if(r.status===409){exists=true}upd();return}
      ME={name,token:r.token,salons:r.salons||[]};L.del("fl-guest");store();
      // les salons déjà visités sur cet appareil sont rattachés au pseudo
      const loc=localSalons();if(LINK&&!loc.includes(LINK))loc.unshift(LINK);for(const c of loc.slice(0,8))await link(c);
      if(LINK)L.set("fl-ok-"+LINK,"1");
      if(opts.then)opts.then();else if(opts.home||isGen())location.href="/";else location.reload()};
    const g=$(".pg-guest");if(g)g.onclick=()=>{L.set("fl-guest","1");if(LINK&&!opts.home){location.href=location.pathname.includes("/rond")?"/rond":location.pathname.includes("/meles")?"/meles":"/";return}close();applyGuest()};
    const c=$(".pg-cancel");if(c)c.onclick=close;
    if(!matchMedia("(pointer:coarse)").matches)setTimeout(()=>nm.focus(),60)}

  // ---------- « Ma page » ----------
  function myPage(){if(!ME)return gate({home:true});
    const ov=shell('<h2 class="pg-hello">Bonjour <span class="pg-me"></span> 👋</h2>'
      +'<div class="pg-sec"><div class="pg-sectitle">Mes salons</div><div class="pg-list"><div class="muted">Chargement…</div></div></div>'
      +'<div class="pg-acts"><button type="button" class="primary pg-new">＋ Créer un salon</button>'
      +'<form class="pg-join"><input maxlength="5" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Code d\'un salon"><button type="submit">Rejoindre</button></form>'
      +'<button type="button" class="pg-solo">🎯 Jouer en solo</button><a class="pg-mot" href="/mot">📅 Le mot du jour</a></div>'
      +'<details class="pg-more"><summary>Mon compte</summary><div class="pg-morein"><form class="pg-chpin"><label>Nouveau code secret <input type="password" inputmode="numeric" maxlength="4" placeholder="••••"></label><button type="submit">Changer</button></form>'
      +'<button type="button" class="pg-out">Se déconnecter de cet appareil</button></div></details>',true);
    const $=s=>ov.querySelector(s);$(".pg-me").textContent=ME.name;
    const draw=list=>{const box=$(".pg-list");box.innerHTML="";if(!list.length){box.innerHTML='<div class="muted">Pas encore de salon. Crée-en un et envoie le code à tes amis, ou rejoins celui d\'un ami.</div>';return}
      list.forEach(s=>{const a=document.createElement("a");a.className="pg-salon"+(s.code===(window.SALON||LINK)?" here":"");a.href="/"+s.code;
        a.innerHTML='<span class="pg-code"></span><span class="pg-info"></span><span class="pg-go2">›</span>';a.querySelector(".pg-code").textContent=s.code;
        a.querySelector(".pg-info").textContent=(s.open?"● partie en cours · ":"")+(s.live?s.live+" connecté"+(s.live>1?"s":"")+" · ":"")+ago(s.t);if(s.open)a.classList.add("live");
        a.onclick=e=>{L.set("fl-ok-"+s.code,"1");if(s.code===window.SALON&&!LINK){e.preventDefault();close()}};box.appendChild(a)})};
    draw(ME.salons||[]);
    call("me",{name:ME.name,token:ME.token}).then(r=>{if(r.status===200){ME.salons=r.salons;store();if(ov.isConnected)draw(r.salons)}else if(r.status===401){ME=null;store();gate({home:true,title:"Reconnecte-toi",why:"Ton appareil a été déconnecté. Entre ton pseudo et ton code secret."})}});
    $(".pg-new").onclick=async()=>{const c=newCode();L.set("fl-ok-"+c,"1");await link(c);location.href="/"+c};
    $(".pg-join").onsubmit=e=>{e.preventDefault();const i=e.target.querySelector("input");const c=clean(i.value).replace(/[@#_]/g,"");if(!/^[A-Z0-9]{5}$/.test(c)){i.classList.add("err");i.focus();return}L.set("fl-ok-"+c,"1");link(c);location.href="/"+c};
    $(".pg-join input").addEventListener("input",e=>{e.target.value=clean(e.target.value).replace(/[@#_]/g,"").slice(0,5);e.target.classList.remove("err")});
    $(".pg-solo").onclick=()=>{close();const b=document.querySelector('#modeSeg [data-v="solo"]');if(b)b.click()};
    $(".pg-chpin").onsubmit=async e=>{e.preventDefault();const i=e.target.querySelector("input");if(!/^\d{4}$/.test(i.value)){i.focus();return}const r=await call("pin",{name:ME.name,token:ME.token,pin:i.value});i.value="";e.target.querySelector("button").textContent=r.status===200?"Changé ✓":"Erreur"};
    $(".pg-out").onclick=async()=>{await call("logout",{name:ME.name,token:ME.token});ME=null;store();location.href="/"}}
  window.__myPage=myPage;window.__pseudoGate=gate;

  // ---------- mode invité : solo uniquement ----------
  function applyGuest(){document.body.classList.add("guest");const solo=document.querySelector('#modeSeg [data-v="solo"]');const multi=document.querySelector('#modeSeg [data-v="multi"]');
    if(multi&&multi.getAttribute("aria-checked")==="true"&&solo)solo.click();
    document.querySelectorAll("nav.tables a").forEach(a=>{const m=a.getAttribute("href").match(/\/(rond|meles)$/);if(m)a.href="/"+m[1];else if(/^\/[A-Z0-9]{5}$/.test(a.getAttribute("href")))a.href="/"});
    bar()}
  document.addEventListener("click",e=>{const a=false&&e.target.closest&&e.target.closest("nav.tables a");if(a){const m=(a.getAttribute("href")||"").match(/^\/[A-Za-z0-9]{5}(\/(rond|meles))?$/);if(m){e.preventDefault();L.set("fl-guest","1");location.href=m[1]||"/";return}}
  const b=false;if(b&&!ME){e.preventDefault();e.stopImmediatePropagation();gate({cancel:true,noGuest:true,home:true,title:"Crée ton pseudo pour jouer à plusieurs",why:"Les salons à plusieurs sont rattachés à un pseudo."})}},true);

  // ---------- barre « Ma page » dans l'accueil ----------
  function bar(){const lobby=document.getElementById("lobby");if(!lobby)return;let b=document.getElementById("pgBar");if(!b){b=document.createElement("div");b.id="pgBar";b.className="pgbar";lobby.insertBefore(b,lobby.firstChild)}

// ---------- lancement depuis la fenêtre de réglages de l'accueil (?go=solo|multi|resume&lvl=…&n=…) ----------
(function(){
  const q=new URLSearchParams(location.search);const go=q.get("go");if(!go)return;
  const $=id=>document.getElementById(id);
  const clean=()=>{try{const u=new URL(location.href);["go","lvl","n","t","opp"].forEach(k=>u.searchParams.delete(k));history.replaceState(null,"",u.pathname+u.search+u.hash)}catch(e){}};
  let tries=0;
  const run=()=>{
    if(!$("start")||!$("modeSeg")){if(++tries<60)return setTimeout(run,100);return}
    const isJeux=!!$("lvlSeg");
    const seg=(id,v)=>{const b=document.querySelector("#"+id+' button[data-v="'+v+'"]');if(b)b.click()};
    if(go==="resume"){seg("modeSeg","multi");setTimeout(()=>{const r=$("resumeBtn");if(r&&!r.closest("[hidden]"))r.click();else{const l=$("liveBtn");if(l&&!l.closest("[hidden]"))l.click()}clean()},400);return}
    seg("modeSeg",go==="solo"?"solo":"multi");
    const lvl=q.get("lvl");if(lvl)seg(isJeux?"lvlSeg":"levelSeg",lvl);
    const n=Number(q.get("n"))||0;
    setTimeout(()=>{
      const sel=$(isJeux?"pick":"gsel");
      if(sel&&n){const opts=[...sel.querySelectorAll("option")].filter(o=>!isJeux||true);
        let o=null;if(isJeux)o=opts[n-1];else{const og=[...sel.querySelectorAll("optgroup")][Math.max(0,["facile","normal","difficile"].indexOf(lvl||"normal"))];o=og?og.querySelectorAll("option")[n-1]:null}
        if(o){sel.value=o.value;sel.dispatchEvent(new Event("change"))}}
      const t=q.get("t");const ts=$("tsel");if(t!==null&&ts&&[...ts.options].some(o=>o.value===t))ts.value=t;
      let me=null;try{me=JSON.parse(localStorage.getItem("fl-me")||"null")}catch(e){}
      const rb=$("resumeBtn");const inProgress=rb&&!rb.closest("[hidden]");
      if(go==="solo"){if(me&&$("n0"))$("n0").value=me.name;clean();if(inProgress&&!n){rb.click();return}$("start").click();return}
      // multijoueur : on prépare la table, il ne reste qu'à indiquer l'adversaire
      // à plusieurs, il faut un pseudo : sinon retour à l'accueil pour en créer un ou jouer en solo
      if(!me||!me.name){location.replace((location.pathname.match(/^\/[A-Za-z0-9]{5}/)||["/"])[0]+"?need=pseudo");return}
      const ins=isJeux?[...document.querySelectorAll("#players input")]:[$("n0"),$("n1")];
      if(me&&ins[0])ins[0].value=me.name;const opp=q.get("opp");if(opp&&ins[1])ins[1].value=opp;
      clean();
      if(ins[1]&&!ins[1].value)ins[1].value="Invité";
      if(ins[0]&&ins[0].value&&ins[1]&&ins[1].value){$("start").click();return}
      const f=ins.find(i=>i&&!i.value);if(f){f.scrollIntoView({block:"center",behavior:"smooth"});setTimeout(()=>f.focus(),300)}
    },350)};
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>setTimeout(run,200));else setTimeout(run,200);
})();

// ---------- points du joueur connecté (classement général et progression) ----------
window.__scorePts=function(game,G){try{
  if(!G||!G.done||G.revealed||!G.players)return;let me=null;try{me=JSON.parse(localStorage.getItem("fl-me")||"null")}catch(e){}
  if(!me||!me.token)return;const key="fl-sc-"+game+G.gid;if(localStorage.getItem(key))return;
  const i=G.solo?0:G.players.findIndex(p=>String(p.name||"").toUpperCase()===me.name);if(i<0)return;
  const pts=Number(G.players[i].score)||0;localStorage.setItem(key,"1");
  fetch("/api/p/score",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:me.name,token:me.token,game,gid:String(G.gid),pts,solo:!!G.solo,level:G.level||""})}).catch(()=>{})}catch(e){}};

// ---------- accueil = point d'entrée : plus d'ancien écran de choix des grilles ----------
(function(){
  const $=id=>document.getElementById(id);
  const home=()=>{const m=location.pathname.match(/^\/([A-Za-z0-9]{5})\//);return m?"/"+m[1]:"/"};
  const q=new URLSearchParams(location.search);
  // bouton de retour du jeu → accueil (la partie reste en cours et se reprend depuis la tuile)
  const wire=()=>{["retour","back"].forEach(id=>{const b=$(id);if(!b||b.dataset.home)return;if(!b.closest("#game"))return;b.dataset.home="1";
      b.innerHTML="🏠<span class=\"long\"> Accueil</span>";b.title="Retour à l'accueil";b.onclick=e=>{e.preventDefault();location.href=home()}})};
  // arrivée directe sur une page de jeu sans partie ouverte → accueil
  const bounce=()=>{const L=$("lobby"),G=$("game");if(L&&G&&!L.hidden&&G.hidden)location.replace(home())};
  // la place « Invité » revient au premier joueur avec pseudo qui ouvre la partie (son pseudo remplace « Invité »)
  const claim=()=>{try{if(typeof G==="undefined"||!G||G.solo||G.done||mySeat()!==null)return;let me=null;try{me=JSON.parse(localStorage.getItem("fl-me")||"null")}catch(e){}if(!me||!me.name)return;
    const i=G.players.findIndex(p=>p.name==="Invité");if(i<0||G.players.some(p=>String(p.name).toUpperCase()===me.name))return;G.players[i].name=me.name;setSeat(i);save();render()}catch(e){}};
  const go=()=>{wire();setTimeout(bounce,q.get("go")||q.get("join")?6000:1800);setInterval(claim,700)};
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",go);else go();
})();

// ---------- notifications discrètes + cloche ----------
function toast(ic,html){let t=$("skToast");if(!t){t=D.createElement("div");t.id="skToast";D.body.appendChild(t)}
  t.innerHTML="<span class='ti'>"+ic+"</span><span>"+html+"</span>";t.classList.remove("on");void t.offsetWidth;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),4200)}
function bell(){if(LS.get("fl-sound")==="off"||/🔇/.test(q("#skSound").textContent))return;try{const A=window._skac||(window._skac=new (window.AudioContext||window.webkitAudioContext)());const n=A.currentTime;
  [[880,0],[1320,0],[2200,0],[880,.32]].forEach(([f,d],i)=>{const o=A.createOscillator(),g=A.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,n+d);g.gain.linearRampToValueAtTime(i===2?.05:.16,n+d+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d+1.4);o.connect(g).connect(A.destination);o.start(n+d);o.stop(n+d+1.5)})}catch(e){}}
window.skToast=toast;window.skBell=bell;

// bouton maison : partie non terminée → pause / quitter / continuer ; sinon retour direct
const GNAME={fleches:"Mots fléchés",rond:"Le Tourniquet",meles:"Mots mêlés"};
function leaveOrHome(){const st=window.__skState?window.__skState():null;
  if(!st||!st.open||st.done){location.href=homeUrl();return}
  q("#leaveTxt").textContent=GNAME[PAGE]+" : veux-tu mettre la partie en pause pour la reprendre plus tard, ou la quitter ?";
  q("#leaveRule").textContent=st.solo?"En pause, la partie est gardée : « Reprendre » apparaît sur la case du jeu. « Quitter » l'efface.":"En multijoueur, la pause dure 5 minutes maximum et le chrono s'arrête : au-delà, le joueur resté sur la grille gagne et reçoit la moitié de ses points (arrondie au supérieur). Si vous quittez tous les deux, personne ne marque de points.";
  q("#leave").classList.add("on")}

// ---------- surcouches au-dessus de la grille : attente, compte à rebours, pause ----------
function overlay(box){let o=box.querySelector(".skov");if(!o){o=D.createElement("div");o.className="skov";o.innerHTML='<div class="skob"></div>';box.appendChild(o)}return o}
let cdShown=null;
function drawOverlay(box,st){if(!box)return;const o=overlay(box),b=o.firstChild;const now=Date.now();
  if(!st||!st.open||st.solo||st.done){o.classList.remove("on","cd");return}
  if(st.wait){o.classList.add("on");o.classList.remove("cd");const miss=st.missing&&st.missing.length?st.missing.join(" et "):"ton adversaire";
    const key="w"+miss;if(b.dataset.k!==key){b.dataset.k=key;b.innerHTML='<span class="skspin"></span><b>En attente de '+esc(miss)+'…</b><span class="sknote">Le chronomètre démarre dès son arrivée sur la page de jeu.</span><button class="skbtn" type="button">📤 Inviter</button>';b.querySelector(".skbtn").onclick=share}return}
  if(st.go&&now<st.go+1300){o.classList.add("on","cd");const left=Math.ceil((st.go-now)/1000);const k=left>0?String(Math.min(5,left)):"go";
    if(b.dataset.k!==k){b.dataset.k=k;b.innerHTML=k==="go"?'<b class="skgo">Le jeu est lancé</b>':'<b class="skn">'+k+'</b>'}return}
  if(st.away&&st.away.length){o.classList.add("on");o.classList.remove("cd");const rem=Math.max(0,Math.ceil((st.awayUntil-now)/1000));const m=Math.floor(rem/60),s=String(rem%60).padStart(2,"0");
    const k="p"+st.away.join()+m+s;if(b.dataset.k!==k){b.dataset.k=k;b.innerHTML='<span style="font-size:1.7rem">⏸️</span><b>'+esc(st.away.join(" et "))+' a mis la partie en pause.</b><span class="sknote">Chrono de la partie arrêté. Sans retour dans <b>'+m+":"+s+'</b>, tu gagnes la partie avec la moitié de tes points.</span>'}return}
  o.classList.remove("on","cd")}

    else setTitle(PAGE==="rond"?'Le <span style="color:#34d399">Tourniquet</span>':'Mots <span style="color:#34d399">Mêlés</span>',"");
    if(PAGE==="rond")slots();
    drawOverlay(wrapB,window.__skState())};
  D.addEventListener("input",e=>{if(e.target&&e.target.id==="ans")slots()});
  let lw=0,lh=0;setInterval(()=>{const r=wrapB.getBoundingClientRect();if(Math.abs(r.width-lw)>2||Math.abs(r.height-lh)>2){lw=r.width;lh=r.height;try{if(typeof fitMeles==="function"&&PAGE==="meles")fitMeles()}catch(e){}dispatchEvent(new Event("resize"))}},300);
  // mots mêlés : mots trouvés entourés d'une capsule à la couleur du joueur (les croisements gardent les deux capsules)
  if(PAGE==="meles"&&typeof renderMeles==="function"){const orig=renderMeles;
    const caps=()=>{const g=$("mgrid");if(!g||!G)return;let sv=g.querySelector("svg.skcaps");if(!sv){sv=D.createElementNS("http://www.w3.org/2000/svg","svg");sv.setAttribute("class","skcaps");g.appendChild(sv)}
      sv.setAttribute("width",g.clientWidth);sv.setAttribute("height",g.clientHeight);let h="";
      G.words.forEach(w=>{const f=G.found[w.w];if(!f)return;const cs=cellsOf(w);const a0=$("m"+cs[0]),b0=$("m"+cs[cs.length-1]);if(!a0||!b0)return;
        const s0=a0.offsetWidth,x1=a0.offsetLeft+s0/2,y1=a0.offsetTop+s0/2,x2=b0.offsetLeft+s0/2,y2=b0.offsetTop+s0/2;const L=Math.hypot(x2-x1,y2-y1),H=s0*.82,ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
        const col=PCOL[f.by]||"#34d399";h+='<rect x="'+((x1+x2)/2-(L+H)/2)+'" y="'+((y1+y2)/2-H/2)+'" width="'+(L+H)+'" height="'+H+'" rx="'+H/2+'" transform="rotate('+ang+' '+(x1+x2)/2+' '+(y1+y2)/2+')" fill="'+col+'" fill-opacity=".28" stroke="'+col+'" stroke-width="2"/>'});
      sv.innerHTML=h};
    renderMeles=function(){const r=orig.apply(this,arguments);try{caps()}catch(e){}return r};addEventListener("resize",()=>setTimeout(caps,60))}
  setInterval(upd,250);upd()}
function start(){if(PAGE==="poker"){host.dataset.page="poker";D.body.prepend(host);D.body.classList.add("sk-poker");wireHeader();new MutationObserver(syncTheme).observe(D.documentElement,{attributes:true,attributeFilter:["data-theme"]});return}
  mount();D.body.classList.add("sk-"+PAGE);wireHeader();if(PAGE==="fleches")fleches();else jeux()}
if(D.readyState==="loading")D.addEventListener("DOMContentLoaded",start);else start();
})();
