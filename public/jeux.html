<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mots Fléchés Duo — tables de jeu</title>
<meta name="description" content="Le Tourniquet et les mots mêlés, en solo ou en duel en direct.">
<meta name="theme-color" content="#121214">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Condensed:wght@400;500&display=swap">
<style>
:root{
  --bg:#121214;--card:#1E1E24;--card2:#26262e;--line:#2f2f39;--ink:#ECEDF2;--muted:#8B8C99;
  --accent:#00ADB5;--accent-soft:rgba(0,173,181,.16);--violet:#A26BFF;--good:#3ddc97;--bad:#ff4d6d;--warn:#ffc857;
  --p0:#5ad8ff;--p1:#ffa45c;--p2:#7cf0a9;--p3:#c49bff;--reveal:#5b5d6b;--clue:#1a2a33;--clue-ink:#bfe9ec;
  --cellbg:#2a2a33;--glass:rgba(30,30,36,.96);--hair:rgba(255,255,255,.08);--shadow:rgba(0,0,0,.45);--scrim:rgba(5,5,8,.6);
  --r-lg:16px;--r-md:12px;color-scheme:dark
}
body.light{
  --bg:#F2F4F7;--card:#FFFFFF;--card2:#E9EDF2;--line:#D6DCE4;--ink:#14181F;--muted:#5E6573;
  --accent:#00858C;--accent-soft:rgba(0,133,140,.12);--violet:#6D3FD8;--good:#11905A;--bad:#D92D4A;--warn:#B97800;
  --p0:#0B6FB8;--p1:#D24A0B;--p2:#1E8A3E;--p3:#6B3FE0;--reveal:#AAB1BC;--clue:#DDEFF1;--clue-ink:#0E3A3F;
  --cellbg:#FFFFFF;--glass:rgba(255,255,255,.97);--hair:rgba(15,25,40,.10);--shadow:rgba(20,30,50,.16);--scrim:rgba(20,25,35,.35);color-scheme:light
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
button{font-size:.98rem;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r-md);padding:10px 14px;cursor:pointer;min-height:44px;transition:transform .08s,background .15s,border-color .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:default;transform:none}
button.primary{background:linear-gradient(135deg,var(--accent),#0a8f96);color:#041b1d;border-color:transparent;font-weight:800}
body.light button.primary{color:#fff}
input[type=text],select{font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg);color:var(--ink);min-height:44px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-left,0px)) 28px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{background:linear-gradient(90deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.ico{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:1.05rem}
/* tables de jeu */
.tables{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tbl{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);text-decoration:none;color:var(--ink);min-height:62px;position:relative}
.tbl .t{font-weight:800;font-size:.98rem}.tbl .s{font-size:.76rem;color:var(--muted)}
.tbl.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 18px var(--accent-soft);background:linear-gradient(135deg,var(--accent-soft),transparent)}
.tbl .live{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
@media (max-width:560px){.tables{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* accueil */
.lobby{display:flex;flex-direction:column;gap:14px}
.lcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.invite{border-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),transparent)}
.inv-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lbl{font-size:.76rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.inv-code{font-size:1.9rem;font-weight:800;letter-spacing:.18em;color:var(--accent)}
.wa{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:var(--r-md);background:#25d366;color:#06301a;font-weight:700;text-decoration:none}
.count{font-size:.86rem;font-weight:600;color:var(--warn)}.count.ok{color:var(--good)}
.muted{color:var(--muted)}
.hero h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);line-height:1.45}
h2{margin:0;font-size:1.02rem;font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md)}
.seg button{min-height:44px;background:transparent;border-color:transparent;box-shadow:none}
.seg button[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.players{display:flex;flex-direction:column;gap:8px}
.players label{display:flex;align-items:center;gap:10px}
.players input{flex:1;min-width:0}
.sw{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.err{color:var(--bad);font-weight:600;min-height:1.2em}
.rules{font-size:.88rem;line-height:1.5;color:var(--muted)}.rules b{color:var(--ink)}
.rules p{margin:.3em 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.panel .seg,.panel select{background:var(--bg)}
.pickrow{display:flex;gap:8px}.pickrow select{flex:1;min-width:0}
@media (min-width:900px){
  .lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;align-items:start}
  .lcol-a{position:sticky;top:16px}
}
/* partie */
body.playing{overflow:hidden}
body.playing .wrap{max-width:1400px;height:100dvh;padding-bottom:10px}
body.playing header,body.playing .tables{display:none}
#game{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"left tools" "board board" "under under" "acts acts";gap:8px;min-height:0;flex:1}
.gleft{grid-area:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.gtools{grid-area:tools;position:relative;align-self:start;z-index:20}
.board{grid-area:board;overflow:auto;min-height:0;border-radius:var(--r-lg);overscroll-behavior:contain}
.under{grid-area:under;min-width:0}
.acts{grid-area:acts;display:grid;grid-template-columns:1fr 2fr;gap:8px}
.gname{display:none;font-size:1.2rem;font-weight:800}
.gname b{background:linear-gradient(90deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.scores{display:flex;flex-direction:column;gap:5px}
.chip{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:6px 8px 6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);position:relative;overflow:hidden}
.chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc)}
.chip .av{width:9px;height:9px;border-radius:50%;background:var(--line);font-size:0}
.chip.on{border-color:var(--pc);box-shadow:0 0 14px color-mix(in srgb,var(--pc) 35%,transparent)}
.chip.on .av{background:var(--pc);box-shadow:0 0 8px var(--pc)}
.chip .who{display:flex;flex-direction:column;min-width:0}
.chip .nm{font-weight:700;color:var(--pc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.chip .sub{display:none;font-size:.76rem;color:var(--muted)}
.chip b{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums}
.chip b.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.45);color:var(--good)}}
.chip .clk{font-size:.86rem;font-weight:800;font-variant-numeric:tabular-nums;border-radius:8px;padding:3px 8px;background:var(--card2);color:var(--muted);min-width:3.4em;text-align:center}
.chip .clk:empty{display:none}
.chip.on .clk{background:var(--pc);color:#041b1d}
.chip.on .clk.low{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.status{font-size:.88rem;color:var(--muted);min-height:1.3em}
.status.good{color:var(--good)}.status.bad{color:var(--bad)}.status.wait{color:var(--warn)}
.progress{height:4px;border-radius:999px;background:var(--card2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--violet));transition:width .5s}
.gsalon{display:none;font-size:.8rem;color:var(--muted)}
.menubtn{display:flex;align-items:center;gap:8px;font-weight:700}
.menubtn .chev{color:var(--accent)}
.dropdown{position:absolute;right:0;top:52px;min-width:250px;background:var(--glass);border:1px solid var(--hair);border-radius:var(--r-lg);padding:8px;display:flex;flex-direction:column;gap:5px;box-shadow:0 14px 40px var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.dropdown button{text-align:left;box-shadow:none}
.dropdown .info{font-size:.78rem;color:var(--muted);padding:2px 4px}
.k{min-height:52px;font-size:1.02rem;font-weight:800}
.k.go{background:linear-gradient(135deg,var(--accent),#0a8f96);color:#041b1d;border:none}
body.light .k.go{color:#fff}
.k .long{display:none}
.answer{display:flex;gap:8px;align-items:center;background:var(--glass);border:1px solid rgba(0,173,181,.45);border-radius:var(--r-md);padding:8px 10px}
.answer .clue{flex:1;min-width:0;font-weight:600;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.answer input{width:9.5em;text-transform:uppercase;letter-spacing:.2em;font-weight:800;text-align:center}
.win{border:1px solid var(--good);border-radius:var(--r-lg);padding:12px;text-align:center;font-weight:700;background:rgba(61,220,151,.08);display:flex;flex-direction:column;gap:8px;align-items:center}
.win .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.overlay{position:fixed;inset:0;z-index:40;background:var(--scrim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px}
.sheet{background:var(--glass);border:1px solid var(--hair);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:10px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px var(--shadow)}
.sheet h3{margin:0}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.opts button{flex:1 1 140px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;background:var(--glass);border:1px solid var(--hair);padding:10px 16px;border-radius:999px;font-weight:600;box-shadow:0 10px 30px var(--shadow);transition:opacity .5s;max-width:92vw;text-align:center}
.toast.out{opacity:0}
.flash{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:45;pointer-events:none;background:var(--glass);border:1px solid var(--accent);font-weight:800;font-size:1.3rem;padding:14px 24px;border-radius:var(--r-lg);box-shadow:0 0 40px rgba(0,173,181,.5);animation:fl 1.5s forwards}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1}100%{opacity:0}}
#confetti{position:fixed;inset:0;z-index:44;pointer-events:none}
.sharesheet{max-width:460px;max-height:92vh;overflow:auto}
.sharetxt{max-height:110px;overflow:auto;text-align:left;font-size:.78rem;line-height:1.25;white-space:pre-wrap;background:var(--bg);padding:8px 10px;border-radius:10px;margin:0;font-family:inherit}
.sharebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* ---------- Tourniquet ---------- */
.rholder{display:flex;flex-direction:column;align-items:center;gap:6px;--R:40px}
.rond{--nc:6;--B:calc(var(--R)*.62);--C:calc(var(--R)*1.3);position:relative;margin:0 auto;width:calc(var(--R)*1.732*var(--nc) + var(--B) + 6px);height:calc(var(--R)*6 + var(--B) + 6px);flex:none}
.rc{z-index:1;position:absolute;width:var(--C);height:var(--C);border-radius:50%;transform:translate(-50%,-50%);background:var(--clue);color:var(--clue-ink);display:grid;place-items:center;text-align:center;padding:6px;cursor:pointer;font-family:"Roboto Condensed","Arial Narrow",sans-serif;font-size:calc(var(--C)*.15);line-height:1.08;border:2px solid transparent;transition:border-color .15s,box-shadow .15s,background .15s;overflow:hidden;word-break:normal}
.rc span{display:block;max-width:100%}
.rc:active{transform:translate(-50%,-50%) scale(.96)}
.rc.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 0 18px rgba(0,173,181,.4);background:color-mix(in srgb,var(--accent) 22%,var(--clue))}
.rc.done{background:color-mix(in srgb,var(--fc) 18%,var(--card));color:var(--muted)}
.rc.done span{text-decoration:line-through;opacity:.7}
.rb{z-index:2;pointer-events:none;position:absolute;width:var(--B);height:var(--B);border-radius:50%;transform:translate(-50%,-50%);background:var(--cellbg);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:calc(var(--B)*.55);color:var(--ink);transition:background .15s,transform .15s}
.rholder .rond + .rond .rb[data-b^="rs-2-"],.rholder .rond:first-child:not(:only-child) .rb[data-b^="rs-2-"]{outline:2px dashed var(--accent);outline-offset:1px}
.rb.first::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top:6px solid var(--accent);border-bottom:0}
.rb.hint{color:var(--muted);background:var(--card2)}
.rb.pend{color:var(--ink);background:color-mix(in srgb,var(--accent) 30%,var(--cellbg))}
.rb.live{opacity:.7;box-shadow:inset 0 0 0 2px currentColor}
.rb.f{background:color-mix(in srgb,var(--fc) 22%,var(--cellbg));color:var(--fc)}
.rb.rev{color:var(--reveal)}
.rb.ok{animation:pop .5s both;animation-delay:var(--d,0s)}
.rb.wrong{background:var(--bad)!important;color:#fff!important;animation:shake .4s}
@keyframes pop{40%{transform:translate(-50%,-50%) scale(1.25)}}
@keyframes shake{20%,60%{margin-left:-4px}40%,80%{margin-left:4px}}
/* ---------- Mots mêlés ---------- */
.mm{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px}
.mgrid{--s:30px;display:grid;grid-template-columns:repeat(var(--n),var(--s));grid-auto-rows:var(--s);gap:2px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);touch-action:none;user-select:none;-webkit-user-select:none}
.ml{display:grid;place-items:center;border-radius:6px;background:var(--cellbg);font-weight:800;font-size:calc(var(--s)*.56);cursor:pointer;position:relative}
.ml.dragging{background:color-mix(in srgb,var(--accent) 45%,var(--cellbg));color:#fff}
.ml.f{background:color-mix(in srgb,var(--fc) 30%,var(--cellbg));color:var(--fc)}
.ml.f2{box-shadow:inset 0 0 0 2px var(--fc2)}
.ml.rev{background:color-mix(in srgb,var(--reveal) 30%,var(--cellbg))}
.ml.wrong{background:var(--bad);color:#fff}
.ml.ok{animation:mpop .45s both;animation-delay:var(--d,0s)}
@keyframes mpop{40%{transform:scale(1.25)}}
.mwords{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:720px}
.mw{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:.86rem;letter-spacing:.04em}
.mw.f{border-color:var(--fc);color:var(--fc);text-decoration:line-through;background:color-mix(in srgb,var(--fc) 12%,var(--card))}
.mw.rev{color:var(--reveal);text-decoration:line-through}
@media (min-width:900px){
  body.playing .wrap{padding-top:16px}
  #game{grid-template-columns:270px minmax(0,1fr) 270px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"left under tools" "left board acts" "left board acts";gap:12px 24px}
  .gname{display:block}.gsalon{display:block;margin-top:auto}
  .gleft{gap:12px}
  .chip{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"av who sc" "ck ck ck";padding:12px 14px;border-radius:var(--r-lg);row-gap:10px;column-gap:12px}
  .chip .av{grid-area:av;width:42px;height:42px;font-size:1.05rem;font-weight:800;display:grid;place-items:center;color:#041b1d;background:var(--pc)}
  .chip:not(.on) .av{opacity:.75}
  .chip .who{grid-area:who}.chip .sub{display:block}
  .chip b{grid-area:sc;font-size:1.6rem}
  .chip .clk{grid-area:ck;font-size:1.7rem;padding:6px 0;border-radius:10px}
  .menubtn{width:100%;justify-content:space-between;height:52px}
  .dropdown{left:0;right:0;top:60px;min-width:0}
  .acts{display:flex;flex-direction:column-reverse;justify-content:flex-start;align-self:end}
  .acts .k.go{min-height:64px;font-size:1.2rem}
  .k .long{display:inline}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" id="home" href="/"><b>MOTS FLÉCHÉS</b> duo</a>
    <button class="ico" id="soundBtn" type="button" aria-label="Son">🔊</button>
    <button class="ico" id="themeBtn" type="button" aria-label="Thème">☀️</button>
  </header>
  <nav class="tables" id="tables" aria-label="Tables de jeu"></nav>

  <section class="lobby" id="lobby">
    <div class="lcol lcol-a">
      <div class="card hero"><h1 id="heroTitle"></h1><p id="heroText"></p></div>
      <div class="card invite multiOnly">
        <div class="inv-top"><div><div class="lbl">Ton salon</div><div class="inv-code" id="code"></div></div>
          <div style="display:flex;gap:8px"><a class="wa" id="wa" target="_blank" rel="noopener">WhatsApp</a><button type="button" id="copy">Copier le lien</button></div></div>
        <div class="count" id="count">Connexion…</div>
      </div>
      <div class="card invite" id="liveCard" hidden><div style="font-weight:800" id="liveT"></div><div class="muted" style="font-size:.86rem" id="liveS"></div><button type="button" class="primary" id="liveBtn">▶ Rejoindre la partie</button></div>
      <div class="card" id="dailyCard" hidden><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div style="font-weight:800" id="dailyT"></div><div class="muted" style="font-size:.85rem" id="dailyS"></div></div><button type="button" class="primary" id="dailyBtn">Jouer</button></div></div>
    </div>
    <div class="lcol lcol-b panel">
      <h2>1. Mode de jeu</h2>
      <div class="seg" id="modeSeg" role="radiogroup"><button type="button" data-v="solo" role="radio">👤 Solo</button><button type="button" data-v="multi" role="radio">👥 À plusieurs</button></div>
      <h2>2. Difficulté</h2>
      <div class="seg" id="lvlSeg" role="radiogroup"><button type="button" data-v="facile" role="radio">🌱 Facile</button><button type="button" data-v="moyen" role="radio">⚖️ Normal</button><button type="button" data-v="difficile" role="radio">🔥 Difficile</button></div>
      <h2 id="pickT">3. Grille</h2>
      <div class="pickrow"><select id="pick" aria-label="Choix de la grille"></select></div>
      <div class="muted" id="pickInfo" style="font-size:.86rem"></div>
      <h2 id="playersT">4. Joueurs</h2>
      <div id="resume" hidden><button class="primary" id="resumeBtn" type="button" style="width:100%">Reprendre la partie en cours</button><div class="muted" id="resumeInfo" style="text-align:center;font-size:.85rem;margin-top:4px"></div></div>
      <div class="players" id="players"></div>
      <button type="button" id="addP" class="multiOnly" style="border-style:dashed;background:transparent;color:var(--muted)">＋ Ajouter un joueur</button>
      <label style="display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600" id="timerRow">⏱ <span id="timerLbl">Chrono</span> <select id="tsel"></select></label>

  const R=rng(Date.now()^Math.floor(Math.random()*1e9));const pool=THEMES[theme].map(norm).filter(w=>w.length>=3&&w.length<=cfg.n);
  for(let attempt=0;attempt<60;attempt++){const g=Array.from({length:cfg.n},()=>Array(cfg.n).fill(""));const ws=[];const cand=[...pool].sort(()=>R()-.5).sort((a,b)=>b.length-a.length);
    for(const w of cand){if(ws.length>=cfg.k)break;let placed=false;for(let t=0;t<150&&!placed;t++){const [dr,dc]=cfg.dirs[Math.floor(R()*cfg.dirs.length)];const r0=Math.floor(R()*cfg.n),c0=Math.floor(R()*cfg.n);const r1=r0+dr*(w.length-1),c1=c0+dc*(w.length-1);if(r1<0||r1>=cfg.n||c1<0||c1>=cfg.n)continue;
      let ok=true;for(let i=0;i<w.length;i++){const ch=g[r0+dr*i][c0+dc*i];if(ch&&ch!==w[i]){ok=false;break}}if(!ok)continue;
      for(let i=0;i<w.length;i++)g[r0+dr*i][c0+dc*i]=w[i];ws.push({w,r:r0,c:c0,dr,dc});placed=true}}
    if(ws.length<Math.min(cfg.k,pool.length)-1)continue;
    for(let r=0;r<cfg.n;r++)for(let c=0;c<cfg.n;c++)if(!g[r][c])g[r][c]=FREQ[Math.floor(R()*FREQ.length)];
    return{theme,size:cfg.n,grid:g.map(x=>x.join("")),words:ws.sort((a,b)=>a.w.localeCompare(b.w))}}
  throw new Error("grille impossible")}
function cellsOf(w){return Array.from({length:w.w.length},(_,i)=>(w.r+w.dr*i)+"-"+(w.c+w.dc*i))}
let drag=null;
function buildMeles(){const b=$("board");const box=document.createElement("div");box.className="mm";const g=document.createElement("div");g.className="mgrid";g.id="mgrid";g.style.setProperty("--n",G.size);
  for(let r=0;r<G.size;r++)for(let c=0;c<G.size;c++){const e=document.createElement("div");e.className="ml";e.id="m"+r+"-"+c;e.dataset.r=r;e.dataset.c=c;e.textContent=G.grid[r][c];g.appendChild(e)}
  box.appendChild(g);b.appendChild(box);const list=document.createElement("div");list.className="mwords";list.id="mwords";$("under").appendChild(list);
  g.addEventListener("pointerdown",e=>{const t=e.target.closest(".ml");if(!t||!canPlay())return;e.preventDefault();const pt=[+t.dataset.r,+t.dataset.c];
    if(drag&&drag.tap){finishSel(drag.a,pt);drag=null;clearDrag();return}
    drag={a:pt,b:pt,moved:false};paintDrag()});
  g.addEventListener("pointermove",e=>{if(!drag||drag.tap)return;const el=document.elementFromPoint(e.clientX,e.clientY);const t=el&&el.closest&&el.closest(".ml");if(!t)return;const pt=[+t.dataset.r,+t.dataset.c];if(pt[0]!==drag.b[0]||pt[1]!==drag.b[1]){drag.b=pt;drag.moved=true;paintDrag()}});
  const up=()=>{if(!drag||drag.tap)return;if(!drag.moved){drag.tap=true;paintDrag();return}finishSel(drag.a,drag.b);drag=null;clearDrag()};
  window.addEventListener("pointerup",up);g.addEventListener("pointercancel",()=>{drag=null;clearDrag()});
  fitMeles()}
function lineCells(a,b){const dr=Math.sign(b[0]-a[0]),dc=Math.sign(b[1]-a[1]);const lr=Math.abs(b[0]-a[0]),lc=Math.abs(b[1]-a[1]);if(lr&&lc&&lr!==lc)return null;const n=Math.max(lr,lc)+1;return Array.from({length:n},(_,i)=>[a[0]+dr*i,a[1]+dc*i])}
function clearDrag(){document.querySelectorAll(".ml.dragging").forEach(e=>e.classList.remove("dragging"))}
function paintDrag(){clearDrag();if(!drag)return;const L=lineCells(drag.a,drag.b)||[drag.a];L.forEach(([r,c])=>$("m"+r+"-"+c).classList.add("dragging"))}
function finishSel(a,b){const L=lineCells(a,b);if(!L||L.length<2)return;const s=L.map(([r,c])=>G.grid[r][c]).join("");const rev=[...s].reverse().join("");
  const w=G.words.find(x=>(x.w===s||x.w===rev)&&cellsOf(x).join()===(x.w===s?L:[...L].reverse()).map(p=>p.join("-")).join());
  if(!w){sfx("bad");L.forEach(([r,c])=>{const e=$("m"+r+"-"+c);e.classList.add("wrong");setTimeout(()=>e.classList.remove("wrong"),450)});return}
  if(G.found[w.w]!==undefined){toast("Déjà trouvé par "+(G.players[G.found[w.w].by]?.name||"un joueur"));return}
  const s0=mySeat();if(s0==="all"&&!G.solo){const o=$("whoOpts");o.innerHTML="";G.players.forEach((p,i)=>{const bt=document.createElement("button");bt.textContent=p.name;bt.style.color=PCOL[i];bt.style.borderColor=PCOL[i];bt.onclick=()=>{$("whoBox").hidden=true;claim(w,i)};o.appendChild(bt)});$("whoBox").hidden=false;return}
  claim(w,G.solo?0:s0)}
$("whoCancel").onclick=()=>{$("whoBox").hidden=true};
function claim(w,by){const last=Object.keys(G.found).length+1>=G.words.length;
  if(G.solo){G.found[w.w]={by,t:Date.now()};G.players[0].score+=w.w.length;G.msg="Bravo ! « "+w.w+" » +"+w.w.length;G.msgKind="good";if(last){G.done=true;G.ended=Date.now()}bump({word:w.w,ok:true,by});save();render();sfx(last?"win":"ok");if(last)confetti();okAnim(w);return}
  // course : le serveur garde le premier arrivé
  req({t:"patch",id:DOC,gid:G.gid,field:"found",key:w.w,value:{by,t:Date.now()},ifAbsent:true,score:{i:by,add:w.w.length},extra:Object.assign({last:{n:(G.last?.n||0)+1,word:w.w,ok:true,by},msg:G.players[by].name+" trouve « "+w.w+" » (+"+w.w.length+")",msgKind:"good"},last?{done:true,ended:Date.now()}:{})})
    .then(()=>{seenLast=(G.last?.n||0)+1;sfx("ok");buzz(20);okAnim(w);if(last){confetti();sfx("win")}})
    .catch(c=>{if(c==="taken")toast("Trop tard ! Quelqu'un l'a eu juste avant toi.");else toast("Pas enregistré ("+c+")")})}
function okAnim(w){cellsOf(w).forEach((k,i)=>{const e=$("m"+k);if(e){e.style.setProperty("--d",(i*.04)+"s");e.classList.remove("ok");void e.offsetWidth;e.classList.add("ok")}})}
function endMeles(why){if(!G||G.done)return;if(G.solo){G.done=true;G.ended=Date.now();G.revealed=why==="giveup";G.msg=why==="time"?"Temps écoulé !":"Solution affichée.";save();render();return}
  if(window.__ending===G.gid)return;window.__ending=G.gid;
  req({t:"patch",id:DOC,gid:G.gid,field:"meta",key:"end",value:why,ifAbsent:true,extra:{done:true,ended:Date.now(),revealed:why==="giveup",msg:why==="time"?"Temps écoulé !":"Solution affichée.",msgKind:""}}).catch(()=>{})}
function renderMeles(){if(!G||GAME!=="meles"||!$("mgrid"))return;
  document.querySelectorAll(".ml").forEach(e=>{e.classList.remove("f","f2","rev");e.style.removeProperty("--fc");e.style.removeProperty("--fc2")});
  const list=$("mwords");list.innerHTML="";let n=0;
  G.words.forEach(w=>{const f=G.found[w.w];const chip=document.createElement("span");chip.className="mw";chip.textContent=w.w;
    if(f){n++;chip.classList.add("f");chip.style.setProperty("--fc",PCOL[f.by]);cellsOf(w).forEach(k=>{const e=$("m"+k);if(e.classList.contains("f")){e.classList.add("f2");e.style.setProperty("--fc2",PCOL[f.by])}else{e.classList.add("f");e.style.setProperty("--fc",PCOL[f.by])}})}
    else if(G.done){chip.classList.add("rev");cellsOf(w).forEach(k=>$("m"+k).classList.add("rev"))}
    list.appendChild(chip)});
  $("prog").style.width=Math.round(100*n/G.words.length)+"%";
  if(!G.done&&n>=G.words.length)endMeles("all")}
function fitMeles(){const g=$("mgrid");if(!g)return;const b=$("board");const w=b.clientWidth-20,h=b.clientHeight-20;const s=Math.max(22,Math.min(46,Math.floor((Math.min(w,h>120?h:w)-10-2*(G.size-1))/G.size)));g.style.setProperty("--s",s+"px")}
window.addEventListener("resize",()=>{if(G&&GAME==="meles")fitMeles()});

// ---------- démarrage ----------
$("code").textContent=CODE;
const link=location.origin+"/"+CODE+"/"+GAME;
$("wa").href="https://wa.me/?text="+encodeURIComponent((GAME==="rond"?"On fait un Tourniquet ? ":"Une course aux mots mêlés ? ")+"Rejoins mon salon "+CODE+" : "+link);
$("home").href="/"+CODE;
setTheme(THEME);setSound(SOUND);renderLobby();connect();
</script>
