<script>// ===== Sudoku — solo et multijoueur (2 à 4, chacun son tour, comme les mots fléchés) =====
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const Q=new URLSearchParams(location.search);
const CODE=((location.pathname.match(/^\/([A-Za-z0-9]{5})\//)||[])[1]||"").toUpperCase()||null;
const HOME=CODE?"/"+CODE:"/";
let ME=null;try{ME=JSON.parse(LS.get("fl-me")||"null")}catch(e){}if(ME&&!/^(?:[A-Z0-9@#_]{2,7}|INVITE\d{4,5})$/.test(ME.name||""))ME=null;
const DOC="sd",SOLOKEY="fl2-solo-sudoku",GAME="sudoku",REFOF=g=>g.pid;
const PC=["#34d399","#fb7185","#5ad8ff","#c89bff"];
const LVLN={facile:"Facile",moyen:"Intermédiaire",normal:"Intermédiaire",difficile:"Difficile"},DUR={facile:40,moyen:50,normal:50,difficile:60};
const SUDO=window.__SUDOKU||[];
const UNITS=[];for(let r=0;r<9;r++)UNITS.push([...Array(9)].map((_,c)=>r*9+c));for(let c=0;c<9;c++)UNITS.push([...Array(9)].map((_,r)=>r*9+c));for(let b=0;b<9;b++){const br=Math.floor(b/3)*3,bc=b%3*3;UNITS.push([...Array(9)].map((_,k)=>(br+Math.floor(k/3))*9+bc+k%3))}
const unitsOf=i=>UNITS.filter(u=>u.includes(i));
let G=null,P=null,ws=null,docs={},peers=[],reqN=0,sel=null,dig=0,notesOn=false,NOTES={};

// ---------- sons ----------
let AC=null;function tone(f,d,t,type,v){if(LS.get("fl-sound")==="off")return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime+(d||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.12,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+(t||.25));o.connect(g).connect(AC.destination);o.start(n);o.stop(n+(t||.25)+.05)}catch(e){}}
const sfx={ok:()=>{tone(660,0,.15);tone(880,.1,.2)},unit:()=>[660,880,1100,1320].forEach((f,i)=>tone(f,i*.08,.2)),bad:()=>tone(200,0,.25,"square",.06),warn:()=>tone(440,0,.18,"triangle",.1),bell:()=>[[880,0],[1320,0],[880,.32]].forEach(([f,d])=>tone(f,d,1.3,"sine",.14)),key:()=>tone(1180,0,.05,"triangle",.06)};
(m=>Object.keys(m).forEach(k=>{const f=sfx[k];sfx[k]=function(){return(window.MotipopSons&&window.MotipopSons.play(m[k]))||f.apply(this,arguments)}}))({ok:"mot",bad:"faux",warn:"tictac",bell:"ding"});
function toast(ic,html){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t)}t.innerHTML="<span class='ti'>"+ic+"</span><span>"+html+"</span>";t.classList.remove("on");void t.offsetWidth;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),4200)}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};

// ---------- état de la grille ----------
// valeur d'une case : donnée (P.p), trouvée (G.cells : multijoueur, toujours juste) ou saisie (G.v : solo, peut être fausse)
const given=i=>P.p[i]!==".";
const sol=i=>+P.s[i];
function val(i){if(given(i))return +P.p[i];if(G.cells&&G.cells[i]!==undefined)return sol(i);if(G.solo&&G.v&&G.v[i])return G.v[i];return 0}
function filledCount(){let n=0;for(let i=0;i<81;i++)if(val(i))n++;return n}
function fillRatio(){let n=0;for(let i=0;i<81;i++)if(given(i)||(G.cells&&G.cells[i]!==undefined))n++;return n/81}
function conflict(i){const v=val(i);if(!v)return false;return unitsOf(i).some(u=>u.some(j=>j!==i&&val(j)===v))}
function unitDone(u){return u.every(j=>val(j)&&(given(j)||(G.cells&&G.cells[j]!==undefined)||(G.solo&&G.v[j]===sol(j))))}

// ---------- joueurs, places, salon (mêmes règles que les mots fléchés et le Tourniquet) ----------
function mySeat(){if(!G)return null;if(G.solo||G.bot)return 0;if(!ME)return null;const i=G.players.findIndex(p=>String(p.name).toUpperCase()===ME.name);return i<0?null:i}
function away(){return G&&G.away?Object.keys(G.away):[]}
function frozen(){return !!G&&!G.solo&&!G.done&&(G.wait||(G.go&&Date.now()<G.go)||away().length>0)}
function canPlay(){if(!G||G.done)return false;if(G.solo)return true;if(frozen())return false;return mySeat()===G.turn}
function dur(){return DUR[G.level]||50}
// fin de tour : à 80 % de grille remplie, chacun n'a plus droit qu'à un dernier tour (G.last = tours restants)
function nextTurn(){G.turn=(G.turn+1)%G.players.length;G.turnStart=Date.now();if(G.f80){G.last=(G.last||G.players.length)-1;if(G.last<=0){finish("Dernier tour joué : la partie est finie.");return true}}return false}
function connect(){if(!CODE)return;ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
  ws.onopen=()=>{ws.send(JSON.stringify({t:"join",room:CODE,name:ME?ME.name:"",token:ME?ME.token:"",k:Q.get("k")||""}));announce(true)};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.t==="error"&&(m.code==="auth"||m.code==="forbidden")){ws.onclose=null;ws.close();location.replace(m.code==="auth"?HOME:"/?open=salon");return}
    if(m.t==="drawn"&&drawCb[m.req]){drawCb[m.req](m);delete drawCb[m.req];return}
    if(m.t==="room"){window.SK_ROOM=m;window.dispatchEvent(new Event("sk-room"));return}
    if(m.t==="snap"){window.__snapped=1;docs={};(m.docs||[]).forEach(d=>docs[d.id]=d.data);if(window.FLINV)setTimeout(()=>FLINV(docs,{gid:G&&G.gid}),0);LS.set("fl-salon-"+CODE,JSON.stringify({docs}));onSnap()}
    else if(m.t==="peers"){peers=m.peers||[];if(G&&!G.solo){waitCheck();render()}}};
  ws.onclose=()=>setTimeout(connect,1500)}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function save(){if(!G||G.bot)return;if(G.solo){G.saved=Date.now();G.notes=NOTES;soloPut();LS.set(SOLOKEY,JSON.stringify(G));if(G.done)LS.del("fl-paused-sudoku");else LS.set("fl-paused-sudoku","1");return}send({t:"set",id:DOC,data:JSON.parse(JSON.stringify(G)),req:++reqN})}
let lastAnn="";function announce(force){if(G&&G.bot)return;const p={name:ME?ME.name:"",page:"sudoku",gid:G?G.gid:null,seat:mySeat(),sel:canPlay()?sel:null,dig:canPlay()?dig:0};const j=JSON.stringify(p);if(!force&&j===lastAnn)return;lastAnn=j;send({t:"presence",presence:p})}
function onSnap(){const d=docs[DOC];if(!G||G.solo)return;
  if(d&&d.gid===G.gid){const re=d.pid!==G.pid;G=d;if(re){P=SUDO.find(x=>x.id===G.pid)||P;sel=null;dig=0}if(G.blocked)blockedWin(G.blocked);if(!canPlay()){dig=0}render()}
  else if(d&&d.prev===G.gid){G=d;sel=null;dig=0;P=SUDO.find(x=>x.id===G.pid)||P;render();toast("🔁","Nouvelle grille pour le salon")}}
function seatsHere(){const s=new Set();if(G&&G.bot){G.players.forEach((p,i)=>s.add(i));return s}const me=mySeat();if(me!==null)s.add(me);peers.forEach(p=>{const pr=p.presence||{};if(pr.gid===G.gid&&pr.seat!=null&&pr.page==="sudoku")s.add(Number(pr.seat))});return s}
// salle d'attente (comme les mots fléchés) : table hors salon = départ dès 2 joueurs ; salon = 4 présents ou bouton « Lancer la partie »
function presentSeats(){const s=seatsHere();return G.players.map((p,i)=>i).filter(i=>s.has(i)&&G.players[i].name!=="Invité")}
function waitCheck(){if(!G||G.solo||G.done||!G.wait||G.blocked)return;if(mySeat()===null){joinWait();return}const s=seatsHere();
  const all=G.players.length>=2&&G.players.every((p,i)=>s.has(i)&&p.name!=="Invité");
  if(window.SK_ROOM&&SK_ROOM.temp&&all&&presentSeats()[0]===mySeat()){if(!waitCheck.at)waitCheck.at=Date.now();if(Date.now()-waitCheck.at>1500){waitCheck.at=0;launchNow()}return}
  if(G.players.length>=4&&all&&presentSeats()[0]===mySeat())launchNow()}
function launchNow(){if(!G||!G.wait||G.done||mySeat()===null)return;const keep=presentSeats().map(i=>G.players[i]);if(keep.length<2){toast("⏳","Il faut au moins 2 joueurs présents pour lancer.");return}
  if(keep.length!==G.players.length)G.players=keep.map(p=>({name:p.name,score:0}));G.turn=Math.floor(Math.random()*G.players.length);G.turnStart=Date.now();
  G.msg="🎲 Tirage au sort : "+G.players[G.turn].name+" commence !";save();setTimeout(askLaunch,350)}
// salle d'attente : un joueur du salon qui ouvre la page rejoint la partie (4 au plus)
let joinTry="";function joinWait(){if(!G||G.solo||G.done||!G.wait||!ME||G.blocked||mySeat()!==null||joinTry===G.gid)return;const i=G.players.findIndex(p=>p.name==="Invité");if(i>=0)G.players[i].name=ME.name;else if(G.players.length<4)G.players.push({name:ME.name,score:0});else return;joinTry=G.gid;save();announce(true);render()}
function pauseGame(){if(!G||G.done)return;if(G.solo){save();return}const s=mySeat();if(s===null)return;G.away=G.away||{};if(!away().length)G.pauseRem=Math.max(0,G.turnStart+dur()*1000-Date.now());G.away[s]=Date.now();save()}
function resumeGame(){if(!G||G.solo||!G.away)return;const s=mySeat();if(s===null||G.away[s]===undefined)return;delete G.away[s];if(!away().length){G.turnStart=Date.now()-(dur()*1000-(G.pauseRem||dur()*1000));delete G.away;delete G.pauseRem}save()}

function awayCheck(force){if(!G||G.solo||G.done||!G.away)return;const now=Date.now();if(!Object.keys(G.away).some(k=>G.away[k]===0||now-G.away[k]>=300000))return;

  else{G.players.forEach((p,i)=>{p.score=stay.includes(i)?Math.ceil(p.score/2):0});G.msg=stay.map(i=>G.players[i].name).join(" et ")+" gagne : "+(G.quitBy?G.quitBy+" a quitté la partie":"l'adversaire n'est pas revenu à temps")+". Points divisés par deux."}

  if(G.solo){if(notesOn&&d){const n=NOTES[sel]||[];NOTES[sel]=n.includes(d)?n.filter(x=>x!==d):n.concat(d).sort();render();save();return}
    G.v[sel]=d||0;if(!d)delete G.v[sel];else{delete NOTES[sel];if(d!==sol(sel)){G.err=(G.err||0)+1}else{const u=unitsOf(sel).filter(unitDone);if(u.length)sfx.unit();unitsOf(sel).forEach(u2=>u2.forEach(j=>{if(NOTES[j])NOTES[j]=NOTES[j].filter(x=>x!==d)}))}}
    histMark("s");if(filledCount()===81)checkSolo();save();render();return}
  if(notesOn&&d){const n=NOTES[sel]||[];NOTES[sel]=n.includes(d)?n.filter(x=>x!==d):n.concat(d).sort();render();return}
  dig=d;render();announce()}
function checkSolo(){let bad=0;for(let i=0;i<81;i++)if(!given(i)&&G.v[i]!==sol(i))bad++;

  const pts=Math.max(10,40-5*(G.hints||0));G.players[0].score=pts;finish("Grille résolue en "+fmt(((Date.now())-G.started)/1000)+" !")}

function validate(bot){if(bot!==true&&!canPlay())return;if(G.solo){if(filledCount()===81)checkSolo();else $("#msg").textContent="Remplis toute la grille : elle se vérifie toute seule.";return}

  const me=G.turn,p=G.players[me],i=sel;
  if(dig===sol(i)){G.cells[i]=me;let gain=5;const u=unitsOf(i).filter(unitDone);gain+=3*u.length;p.score+=gain;
    G.msg="Bravo "+p.name+" ! +"+gain+(u.length?" ("+u.length+" ligne"+(u.length>1?"s":"")+"/bloc complété"+(u.length>1?"s":"")+")":"");u.length?sfx.unit():sfx.ok();G.lastCell=i;
    if(filledCount()===81){p.score+=10;sel=null;dig=0;finish(p.name+" termine la grille : +10 points de bonus !");save();render();announce();return}
    if(!G.f80&&fillRatio()>=.8){G.f80=true;G.last=G.players.length+1;sfx.bell();toast("🔔","<b>Grille à 80 %</b> · plus qu'un tour chacun")}}
  else{sfx.bad();G.msg="Raté pour "+p.name+" : ce n'est pas un "+dig+".";G.lastBad=i}
  sel=null;dig=0;if(!nextTurn())G.msg+=" Au tour de "+G.players[G.turn].name+".";save();render();announce()}
function pass(){if(!canPlay()||G.solo)return;const p=G.players[G.turn];sel=null;dig=0;const end=nextTurn();if(!end)G.msg=p.name+" passe. Au tour de "+G.players[G.turn].name+".";save();render()}

  G.v[i]=sol(i);delete NOTES[i];G.hints=(G.hints||0)+1;sel=i;toast("💡","Case révélée (−5 points)");if(filledCount()===81)checkSolo();save();render()}

  try{if(ME&&ME.token){const i=G.solo?0:mySeat();const k="fl-sc-sudoku"+G.gid;if(i!==null&&!LS.get(k)){LS.set(k,"1");fetch("/api/p/score",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:ME.name,token:ME.token,game:GAME,gid:String(G.gid),pts:G.players[i].score,solo:!!(G.solo||G.bot),level:G.level,ref:String(REFOF(G)),started:G.started})}).then(r=>r.json()).then(repNote).catch(()=>{})}}}catch(e){}}

    if(go==="multi"&&!live){let opp=Q.get("opp")||"Invité";if(opp.toUpperCase()===ME.name)opp="Invité";
      drawReq(lvl,n,opp).then(r=>{if(!r.ok)return blockedWin(r.msg);const p=SUDO.find(x=>x.id===r.ref);if(!p)return blockedWin("Impossible de vérifier les parties disponibles. Réessaie.");const g=newGame(p,[ME.name,opp],false,lvl);open(g);save()});return}
    if(d&&d.players&&!d.solo){open(d);return}if(go==="join"||Q.get("k")){tableWait();return}const g=solo();if(g&&!g.done){open(g);return}location.replace(HOME)}},100)}
let drawN=0;const drawCb={};
function drawReq(level,n,opp){return new Promise(res=>{const req=++drawN;drawCb[req]=res;send({t:"draw",req,game:GAME,level,n:n||0,opp:opp&&opp!=="Invité"?opp:""});setTimeout(()=>{if(drawCb[req]){delete drawCb[req];res({ok:false,msg:"Impossible de vérifier les parties disponibles. Réessaie."})}},8000)})}
function blockedWin(msg){document.body.classList.remove("booting");$("#endT").textContent=msg;$("#endB").innerHTML="";const a=$("#endAgain");if(a)a.style.display="none";endOpen(true)}
let lastLaunch=0;function askLaunch(){if(Date.now()-lastLaunch<1500)return;lastLaunch=Date.now();send({t:"launch",id:DOC,gid:G.gid})}
function histMark(ev){try{if(!G||G.bot)return;if(!ME||!ME.token){guestRecord(ev);return}if(!G.solo&&mySeat()===null)return;const ref=REFOF(G);if(!ref)return;const k="fl-h"+ev+"-"+GAME+"-"+G.gid;if(LS.get(k))return;LS.set(k,"1");
  const q=JSON.parse(LS.get("fl-hq")||"[]");q.push({u:ME.name,game:GAME,ref,ev});LS.set("fl-hq",JSON.stringify(q.slice(-300)));histFlush()}catch(e){}}
let hFlying=false;function histFlush(){if(hFlying||!ME||!ME.token)return;let q=[];try{q=JSON.parse(LS.get("fl-hq")||"[]")}catch(e){}const mine=q.filter(x=>x.u===ME.name);if(!mine.length)return;hFlying=true;const by={};mine.forEach(x=>(by[x.game]=by[x.game]||[]).push({ref:x.ref,ev:x.ev}));
  Promise.all(Object.entries(by).map(([game,items])=>fetch("/api/p/hist",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:ME.name,token:ME.token,game,items})}).then(r=>{if(!r.ok)throw 0})))
    .then(()=>{let q2=[];try{q2=JSON.parse(LS.get("fl-hq")||"[]")}catch(e){}const sent=new Set(mine.map(x=>JSON.stringify(x)));LS.set("fl-hq",JSON.stringify(q2.filter(x=>!sent.has(JSON.stringify(x)))))}).catch(()=>{}).finally(()=>{hFlying=false})}
setTimeout(histFlush,1500);
const GUEST_MAX=3;
function guestCount(){try{return JSON.parse(LS.get("fl-guest-g")||"[]").length}catch(e){return 0}}
function guestRecord(ev){try{if(!G||!G.solo)return;const ref=REFOF(G);const h=JSON.parse(LS.get("fl-guest-h")||"[]");if(!h.some(x=>x.game===GAME&&x.ref===ref&&x.ev===ev))h.push({game:GAME,ref,ev});LS.set("fl-guest-h",JSON.stringify(h.slice(-300)));
  if(ev==="s"){const g=JSON.parse(LS.get("fl-guest-g")||"[]");if(!g.includes(G.gid)){g.push(G.gid);LS.set("fl-guest-g",JSON.stringify(g))}}}catch(e){}}
function soloPut(){if(!G||!G.solo||!ME||!ME.token)return;clearTimeout(soloPut.t);const doc=G.done?null:JSON.parse(JSON.stringify(G));soloPut.t=setTimeout(()=>{fetch("/api/p/solo",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:ME.name,token:ME.token,game:GAME,op:"put",doc})}).catch(()=>{})},G.done?0:1500)}
function soloGet(){if(!ME||!ME.token)return Promise.resolve(null);return Promise.race([fetch("/api/p/solo",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:ME.name,token:ME.token,game:GAME})}).then(r=>r.ok?r.json():null).catch(()=>null),new Promise(r=>setTimeout(()=>r(null),1500))])}
function soloBoot(go,lvl,n){let loc=null;try{loc=JSON.parse(LS.get(SOLOKEY)||"null")}catch(e){}
  const old=g=>g&&g.solo&&!g.done&&(go==="resume"||(!n&&g.level===lvl));
  const thaw=g=>{const t=g.pauseAt||g.saved;if(g.started&&t&&Date.now()>t)g.started+=Date.now()-t;delete g.pauseAt;return g};
  if(go==="resume"&&old(loc)){open(thaw(loc));save();return}
  soloGet().then(r=>{const sv=r&&r.doc;let best=old(loc)?loc:null;if(old(sv)&&(!best||(sv.saved||0)>(best.saved||0)))best=sv;
    if(best){open(thaw(best));save();return}if(go==="resume"){location.replace(HOME);return}
    if(!ME&&guestCount()>=GUEST_MAX){location.replace("/?need=compte");return}
    open(newGame(choose(lvl,n,new Set((r&&r.played)||[])),[ME?ME.name:"Toi"],true,lvl));save()})}
// ---------- multijoueur hors salon : table rejointe, robot de secours ----------
const mjReady=f=>{(function w(){window.MJ?f():setTimeout(w,30)})()};
function tableWait(){mjReady(()=>MJ.tableWait(()=>{const d=docs[DOC];if(!G&&d&&d.players&&!d.solo)open(d);return !!G},blockedWin))}
const BOT={facile:{ok:.85,t:[5,10]},moyen:{ok:.75,t:[7,13]},difficile:{ok:.65,t:[9,16]}};
function botStart(lvl){lvl=lvl==="normal"?"moyen":lvl;const g=newGame(choose(lvl),[ME?ME.name:"Toi","Robot Pop"],false,lvl);g.bot=1;g.wait=false;g.go=Date.now()+5600;g.started=g.go;g.turnStart=g.go;g.msg="🤖 Partie contre le robot ! "+g.players[g.turn].name+" commence.";open(g);render()}
let botAt=0;
function botTick(){if(!G||!G.bot||G.done||frozen()||G.turn!==1){botAt=0;return}const now=Date.now(),c=BOT[G.level]||BOT.facile;if(!botAt){botAt=now+1000*(c.t[0]+Math.random()*(c.t[1]-c.t[0]));return}if(now<botAt)return;botAt=0;
  const e=[];for(let i=0;i<81;i++)if(!val(i))e.push(i);if(!e.length)return;sel=e[Math.floor(Math.random()*e.length)];dig=Math.random()<c.ok?sol(sel):(sol(sel)%9)+1;validate(true)}
setInterval(botTick,300);
window.FLMJ={playing:()=>!!(G&&!G.done&&!G.wait),robot:lvl=>botStart(lvl),busy:()=>!!(G&&!G.solo&&!G.bot&&!G.done)};
if(location.hostname==="localhost")window.__t=c=>eval(c);
start();
})();
