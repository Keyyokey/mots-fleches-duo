# Déploiement sur Render (https://render.com) — offre GRATUITE
# Le site s'endort après ~15 min sans visite (réveil ~1 min) et les parties sont effacées à chaque redémarrage.
# Pour passer en payant plus tard : plan: starter + bloc disk (voir LISEZMOI).
services:
  - type: web
    name: mots-fleches-duo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SUPPORT_URL      # lien de don (facultatif) — à remplir plus tard sur Render
        sync: false
