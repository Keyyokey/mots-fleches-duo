<style id="endlv">.endlv{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 8px}.endlv small{font:700 .78rem Nunito,Inter,sans-serif;opacity:.8}.endlv .lvrow{display:flex;gap:6px;width:100%}.endlv .lvrow button{all:unset;box-sizing:border-box;flex:1;cursor:pointer;text-align:center;min-height:44px;padding:10px 6px;border-radius:14px;font:800 .9rem Nunito,Inter,sans-serif;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.endlv .lvrow button.on{background:linear-gradient(135deg,#00ADB5,#7c5cf0);border-color:transparent;color:#fff}.endlv .lvrow button:focus-visible{outline:2px solid #00ADB5;outline-offset:2px}[data-theme=light] .endlv .lvrow button:not(.on){background:rgba(15,25,40,.06);border-color:rgba(15,25,40,.18)}</style><main class="view on" id="v-mg">
